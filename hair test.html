<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hairstyle Test</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #b9d8e8;
font-family: Arial, sans-serif;
}
#message {
position: absolute;
top: 12px;
left: 12px;
padding: 12px;
background: white;
border-radius: 8px;
z-index: 2;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
}
}
</script>
</head>

<body>
<div id="message">Loading boy and hairstyle...</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#b9d8e8');

const camera = new THREE.PerspectiveCamera(
45, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(0, 1.5, 5.5);
camera.lookAt(0, 1.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(3, 5, 5);
scene.add(light);

const loader = new GLTFLoader();

try {
const boyGLTF = await loader.loadAsync(
'https://raw.githubusercontent.com/sefamateeee/our-first-date-kinda-game/main/boy.glb.glb'
);

const boy = boyGLTF.scene;

const originalBox = new THREE.Box3().setFromObject(boy);
const originalSize = originalBox.getSize(new THREE.Vector3());

boy.scale.setScalar(2.8 / originalSize.y);

const fittedBox = new THREE.Box3().setFromObject(boy);
const fittedCenter = fittedBox.getCenter(new THREE.Vector3());

boy.position.x -= fittedCenter.x;
boy.position.z -= fittedCenter.z;
boy.position.y -= fittedBox.min.y;

scene.add(boy);

let originalHair = null;

boy.traverse(object => {
if (object.isMesh && object.name === 'character_3') {
originalHair = object;
}
});

if (!originalHair) {
throw new Error('Could not find original boy hair.');
}

const targetBox = new THREE.Box3().setFromObject(originalHair);
const targetSize = targetBox.getSize(new THREE.Vector3());
const targetCenter = targetBox.getCenter(new THREE.Vector3());

originalHair.visible = false;

const hairGLTF = await loader.loadAsync(
'https://raw.githubusercontent.com/sefamateeee/our-first-date-kinda-game/main/long-straight-hairstyle.glb'
);

const hairScene = hairGLTF.scene;
let newHair = null;

hairScene.traverse(object => {
if (object.isMesh) {
const materials = Array.isArray(object.material)
? object.material
: [object.material];

const isHair = materials.some(material =>
material.name === 'Hair_Black'
);

if (isHair) {
newHair = object;
} else {
object.visible = false;
}
}
});

if (!newHair) {
throw new Error('Could not find Hair_Black mesh.');
}

hairScene.updateMatrixWorld(true);

const hairBox = new THREE.Box3().setFromObject(newHair);
const hairSize = hairBox.getSize(new THREE.Vector3());
const hairCenter = hairBox.getCenter(new THREE.Vector3());

const hairFit = new THREE.Group();
scene.add(hairFit);
hairFit.add(hairScene);

hairFit.scale.set(
targetSize.x / hairSize.x,
targetSize.y / hairSize.y,
targetSize.z / hairSize.z
);

hairFit.position.set(
targetCenter.x - hairCenter.x * hairFit.scale.x,
targetCenter.y - hairCenter.y * hairFit.scale.y,
targetCenter.z - hairCenter.z * hairFit.scale.z
);

document.getElementById('message').textContent =
'Loaded! Drag to rotate the view.';

} catch (error) {
document.getElementById('message').textContent =
'Error: ' + error.message;
console.error(error);
}

function animate() {
requestAnimationFrame(animate);
renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
