<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Transition Test</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #20242a;
color: white;
font-family: Arial, sans-serif;
}
#info {
position: absolute;
top: 12px;
left: 12px;
background: #111c;
padding: 14px;
border-radius: 8px;
z-index: 2;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
}
}
</script>
</head>

<body>
<div id="info">
<strong>6-to-4 Road Transition</strong>
<p id="status">Loading model...</p>
<p>Drag to rotate the view. Scroll to zoom.</p>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242a);

const camera = new THREE.PerspectiveCamera(
50, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(9, 9, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 10, 5);
scene.add(light);

scene.add(new THREE.GridHelper(20, 20));
scene.add(new THREE.AxesHelper(5));

const loader = new GLTFLoader();

loader.load(
"city-assets/roads/MS_RD_06_Transition_6to4.glb",
gltf => {
const model = gltf.scene;

const box = new THREE.Box3().setFromObject(model);
const center = box.getCenter(new THREE.Vector3());

model.position.x -= center.x;
model.position.z -= center.z;

const adjusted = new THREE.Box3().setFromObject(model);
model.position.y -= adjusted.min.y;

scene.add(model);

document.getElementById("status").textContent =
"Loaded! Red = X axis, blue = Z axis.";
},
undefined,
error => {
document.getElementById("status").textContent =
"Could not load model. Check the file path.";
console.error(error);
}
);

function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
