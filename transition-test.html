<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road Connection Tester</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #20242a;
color: white;
font-family: Arial, sans-serif;
}
#panel {
position: absolute;
top: 10px;
left: 10px;
z-index: 5;
background: #111e;
padding: 14px;
border-radius: 10px;
width: 220px;
}
button {
padding: 10px;
margin: 3px 0;
width: 100%;
cursor: pointer;
}
#status {
font-size: 13px;
color: #bde5bd;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.170.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
}
}
</script>
</head>

<body>

<div id="panel">
<strong>ROAD CONNECTION TEST</strong>
<p id="status">Loading roads...</p>

<button id="rotate">Rotate transition 90°</button>
<button id="moveLeft">Move transition left</button>
<button id="moveRight">Move transition right</button>
<button id="moveUp">Move transition up</button>
<button id="moveDown">Move transition down</button>
<button id="reset">Reset position</button>

<p>Drag to rotate camera. Scroll to zoom.</p>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242a);

const camera = new THREE.PerspectiveCamera(
50, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(10, 10, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2));

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 12, 5);
scene.add(light);

scene.add(new THREE.GridHelper(30, 30));
scene.add(new THREE.AxesHelper(5));

const loader = new GLTFLoader();
const folder = "city-assets/roads/";

let transition;
let straight;
let rotation = 0;

function centreModel(model) {
const box = new THREE.Box3().setFromObject(model);
const center = box.getCenter(new THREE.Vector3());

model.position.x -= center.x;
model.position.z -= center.z;

const adjusted = new THREE.Box3().setFromObject(model);
model.position.y -= adjusted.min.y;

return model;
}

async function loadRoads() {
try {
const transitionGLTF = await loader.loadAsync(
folder + "MS_RD_06_Transition_6to4.glb"
);

transition = centreModel(transitionGLTF.scene);
scene.add(transition);

const straightGLTF = await loader.loadAsync(
folder + "MS_RD_01_StraightRoad.glb"
);

straight = centreModel(straightGLTF.scene);

// Put the straight road beyond the transition's narrow end.
straight.position.z = -4;

scene.add(straight);

document.getElementById("status").textContent =
"Both roads loaded. Inspect the connection.";

} catch (error) {
console.error(error);
document.getElementById("status").textContent =
"Loading failed: " + error.message;
}
}

document.getElementById("rotate").onclick = () => {
if (!transition) return;
rotation += Math.PI / 2;
transition.rotation.y = rotation;
};

document.getElementById("moveLeft").onclick = () => {
if (transition) transition.position.x -= 0.5;
};

document.getElementById("moveRight").onclick = () => {
if (transition) transition.position.x += 0.5;
};

document.getElementById("moveUp").onclick = () => {
if (transition) transition.position.z -= 0.5;
};

document.getElementById("moveDown").onclick = () => {
if (transition) transition.position.z += 0.5;
};

document.getElementById("reset").onclick = () => {
if (!transition) return;
transition.position.set(0, 0, 0);
transition.rotation.y = 0;
rotation = 0;
};

function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}

loadRoads();
animate();

window.addEventListener("resize", () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
