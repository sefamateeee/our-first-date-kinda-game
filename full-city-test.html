<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our First Date - Midnight Streets Town</title>

  <style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b0f19;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
  }

  #hud {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 10;
    max-width: 320px;
    padding: 14px 18px;
    border-radius: 12px;
    background: rgba(13, 17, 23, 0.88);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  }

  #status {
    font-size: 12px;
    line-height: 1.5;
    color: #7ce3ff;
    margin: 8px 0;
    white-space: pre-line;
  }

  .button-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  button {
    border: 0;
    border-radius: 6px;
    padding: 7px 12px;
    background: #238636;
    color: #ffffff;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  button:hover {
    background: #2ea043;
  }

  button.mode-btn {
    background: #1f6feb;
  }
  button.mode-btn:hover {
    background: #388bfd;
  }

  #hint {
    font-size: 11px;
    color: #8b949e;
    line-height: 1.4;
    margin-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 8px;
  }

  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: none;
    z-index: 100;
  }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
    }
  }
  </script>
  </head>

  <body>

  <div id="crosshair"></div>

  <div id="hud">
    <strong>MIDNIGHT STREETS — CITY PREVIEW</strong>
    <div id="status">Preparing the neighbourhood...</div>

    <div class="button-group">
      <button id="overview" class="mode-btn">🎥 Overview</button>
      <button id="fpsMode" class="mode-btn">🚶 Walk (WASD)</button>
    </div>

    <div class="button-group" style="margin-top: 6px;">
      <button id="btnMidnight">🌙 Midnight</button>
      <button id="btnSunset">🌅 Sunset</button>
      <button id="btnDay">☀️  Day</button>
    </div>

    <div id="hint">
      <strong>Overview:</strong> Drag to orbit · Right-drag to pan · Scroll to zoom.<br>
      <strong>Walk:</strong> Click button, WASD to walk, Mouse to look around, ESC to exit.
    </div>
  </div>

  <script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";
  import { OrbitControls } from "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js";

  // ========================================
  // SCENE SETUP & RENDERER
  // ========================================

  const status = document.getElementById("status");
  const crosshair = document.getElementById("crosshair");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e17);
  scene.fog = new THREE.FogExp2(0x0a0e17, 0.012);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 800);
  camera.position.set(62, 62, 75);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  // ========================================
  // CONTROLS & CAMERA
  // ========================================

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 3);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.maxPolarAngle = Math.PI * 0.48;
  controls.minDistance = 3;
  controls.maxDistance = 200;

  let isFpsMode = false;
  const keysPressed = {};
  const player = {
    position: new THREE.Vector3(0, 1.7, 10),
    yaw: 0,
    pitch: 0,
    speed: 12
  };

  // ========================================
  // LIGHTING & ATMOSPHERE
  // ========================================

  const hemiLight = new THREE.HemisphereLight(0x3a4860, 0x111622, 0.5);
  scene.add(hemiLight);

  const sunlight = new THREE.DirectionalLight(0x8ab4f8, 0.6);
  sunlight.position.set(55, 85, 35);
  sunlight.castShadow = true;
  sunlight.shadow.mapSize.set(2048, 2048);
  sunlight.shadow.camera.left = -90;
  sunlight.shadow.camera.right = 90;
  sunlight.shadow.camera.top = 90;
  sunlight.shadow.camera.bottom = -90;
  scene.add(sunlight);

  const streetLightsGroup = new THREE.Group();
  scene.add(streetLightsGroup);

  function createStreetLamp(x, z) {
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.1, 0.14, 5.5, 8),
      new THREE.MeshStandardMaterial({ color: 0x222226, roughness: 0.5 })
    );
    pole.position.set(x, 2.75, z);
    pole.castShadow = true;
    streetLightsGroup.add(pole);

    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xffd175 })
    );
    bulb.position.set(x, 5.4, z);
    streetLightsGroup.add(bulb);

    const light = new THREE.PointLight(0xffb84d, 2.5, 20, 1.8);
    light.position.set(x, 5.2, z);
    light.castShadow = true;
    streetLightsGroup.add(light);
  }

  function setAtmosphere(preset) {
    if (preset === 'midnight') {
      scene.background.setHex(0x060911);
      scene.fog.color.setHex(0x060911);
      scene.fog.density = 0.015;
      hemiLight.color.setHex(0x223344);
      hemiLight.groundColor.setHex(0x050810);
      hemiLight.intensity = 0.4;
      sunlight.color.setHex(0x6080b0);
      sunlight.intensity = 0.3;
      streetLightsGroup.visible = true;
    } else if (preset === 'sunset') {
      scene.background.setHex(0x3a1c28);
      scene.fog.color.setHex(0x3a1c28);
      scene.fog.density = 0.008;
      hemiLight.color.setHex(0xffaa77);
      hemiLight.groundColor.setHex(0x221122);
      hemiLight.intensity = 1.0;
      sunlight.color.setHex(0xff7744);
      sunlight.intensity = 1.8;
      streetLightsGroup.visible = true;
    } else if (preset === 'day') {
      scene.background.setHex(0x9bb4c3);
      scene.fog.color.setHex(0x9bb4c3);
      scene.fog.density = 0.003;
      hemiLight.color.setHex(0xffffff);
      hemiLight.groundColor.setHex(0x687080);
      hemiLight.intensity = 1.8;
      sunlight.color.setHex(0xffffff);
      sunlight.intensity = 2.4;
      streetLightsGroup.visible = false;
    }
  }
  setAtmosphere('midnight');

  // ========================================
  // GROUND GEOMETRY
  // ========================================

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(220, 200),
    new THREE.MeshStandardMaterial({ color: 0x3d493a, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, -0.22, 3);
  ground.receiveShadow = true;
  scene.add(ground);

  // ========================================
  // ASSET LOADER & PROCEDURAL FALLBACKS
  // ========================================

  const loader = new GLTFLoader();
  const roadFolder = "./city-assets/roads/";
  const roads = [];
  const buildingRoots = [];
  const failedAssets = [];

  const roadFiles = {
    straight: "MS_RD_01_StraightRoad.glb",
    corner: "MS_RD_02_RoadCorner90.glb",
    crossroads: "MS_RD_04_Crossroads.glb",
    transition64: "MS_RD_06_Transition_6to4.glb"
  };

  const savedRoads = [
    {id:1,type:"crossroads",x:-27.429,y:0.16,z:5,rot:0},
    {id:2,type:"crossroads",x:17.6,y:0.16,z:5,rot:0},
    {id:3,type:"straight",x:-18,y:0.16,z:2,rot:0},
    {id:4,type:"straight",x:-12,y:0.16,z:2,rot:0},
    {id:5,type:"straight",x:-6,y:0.16,z:2,rot:0},
    {id:6,type:"straight",x:0,y:0.16,z:2,rot:0},
    {id:7,type:"straight",x:6,y:0.16,z:2,rot:0},
    {id:8,type:"straight",x:12,y:0.16,z:2,rot:0},
    {id:9,type:"transition64",x:-19.622,y:0.16,z:4.504,rot:3.142},
    {id:10,type:"straight",x:-20.626,y:0.16,z:14,rot:1.571},
    {id:11,type:"straight",x:-20.646,y:0.16,z:20,rot:1.571},
    {id:12,type:"transition64",x:-25.784,y:0.16,z:-5,rot:0},
    {id:13,type:"straight",x:-20.903,y:0.16,z:-6.391,rot:1.571},
    {id:14,type:"straight",x:-20.882,y:0.16,z:-12.266,rot:1.571},
    {id:15,type:"transition64",x:26.123,y:0.16,z:4.22,rot:3.142},
    {id:16,type:"straight",x:25.101,y:0.16,z:14.193,rot:1.571},
    {id:17,type:"straight",x:25.094,y:0.16,z:20,rot:1.571},
    {id:18,type:"transition64",x:19.453,y:0.16,z:-5,rot:0},
    {id:19,type:"straight",x:24.375,y:0.16,z:-8.602,rot:1.571},
    {id:20,type:"straight",x:24.392,y:0.16,z:-14.162,rot:1.571},
    {id:21,type:"corner",x:-17.172,y:0.16,z:18.984,rot:-0.032},
    {id:22,type:"corner",x:17.379,y:0.16,z:18.001,rot:-1.557},
    {id:23,type:"straight",x:-18,y:0.16,z:26,rot:0},
    {id:24,type:"straight",x:-12,y:0.16,z:26,rot:0},
    {id:25,type:"straight",x:-6,y:0.16,z:26,rot:0},
    {id:26,type:"straight",x:0,y:0.16,z:26,rot:0},
    {id:27,type:"straight",x:6,y:0.16,z:26,rot:0},
    {id:28,type:"straight",x:12,y:0.16,z:26,rot:0},
    {id:29,type:"corner",x:-16.874,y:0.16,z:-18.121,rot:1.547},
    {id:30,type:"corner",x:16.833,y:0.173,z:-18.225,rot:-0.01},
    {id:31,type:"straight",x:-18,y:0.16,z:-22,rot:0},
    {id:32,type:"straight",x:-12,y:0.16,z:-22,rot:0},
    {id:33,type:"straight",x:-6,y:0.16,z:-22,rot:0},
    {id:34,type:"straight",x:0,y:0.16,z:-22,rot:0},
    {id:35,type:"straight",x:6,y:0.16,z:-22,rot:0},
    {id:36,type:"straight",x:12,y:0.16,z:-22,rot:0}
  ];

  function loadGLB(url) {
    return new Promise((resolve, reject) => {
      loader.load(url, gltf => resolve(gltf.scene), undefined, reject);
    });
  }

  function createProceduralRoadMesh(type) {
    const group = new THREE.Group();
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.8 });
    const curbMat = new THREE.MeshStandardMaterial({ color: 0x888580, roughness: 0.9 });
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xf5d042 });

    const roadMesh = new THREE.Mesh(new THREE.BoxGeometry(6, 0.15, 6), roadMat);
    roadMesh.receiveShadow = true;
    group.add(roadMesh);

    // Sidewalk curbs
    if (type === "straight") {
      const curbL = new THREE.Mesh(new THREE.BoxGeometry(6, 0.22, 0.8), curbMat);
      curbL.position.set(0, 0.05, 2.6);
      const curbR = curbL.clone();
      curbR.position.set(0, 0.05, -2.6);
      group.add(curbL, curbR);

      // Center line
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(4, 0.17, 0.12), lineMat);
      stripe.position.y = 0.08;
      group.add(stripe);
    }

    group.userData.localRoadSize = new THREE.Vector3(6, 0.15, 6);
    group.userData.localRoadTop = 0.075;
    return group;
  }

  async function addRoad(type, x, z, rotation = 0, y = 0.16) {
    let model;
    try {
      model = await loadGLB(roadFolder + roadFiles[type]);
      const bounds = new THREE.Box3().setFromObject(model);
      const center = bounds.getCenter(new THREE.Vector3());
      model.position.x -= center.x;
      model.position.z -= center.z;
      const adjusted = new THREE.Box3().setFromObject(model);
      model.position.y -= adjusted.min.y;

      model.updateMatrixWorld(true);
      const localBounds = new THREE.Box3().setFromObject(model);
      model.userData.localRoadSize = localBounds.getSize(new THREE.Vector3());
      model.userData.localRoadTop = localBounds.max.y;
    } catch (e) {
      model = createProceduralRoadMesh(type);
    }

    model.position.set(x, y, z);
    model.rotation.y = rotation;
    model.userData.roadType = type;

    scene.add(model);
    roads.push(model);
    return model;
  }

  function createProceduralBuildingMesh(filename, label) {
    const group = new THREE.Group();
    let color = 0x8fa3b8;
    let isStore = false;

    if (filename.includes("bakery")) {
      color = 0xee9b00;
      isStore = true;
    } else if (filename.includes("Shop") || filename.includes("Storefront")) {
      color = 0x0a9396;
      isStore = true;
    } else if (filename.includes("Bungalow") || filename.includes("House")) {
      color = 0xca6702;
    } else if (filename.includes("Apartment") || filename.includes("Block")) {
      color = 0x9b5de5;
    }

    const height = isStore ? 5.5 : (filename.includes("Apartment") ? 9 : 6);
    const width = isStore ? 7 : 6;
    const depth = 6;

    const body = new THREE.Mesh(
      new THREE.BoxGeometry(width, height, depth),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 })
    );
    body.position.y = height / 2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    // Roof accent
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(width + 0.4, 0.4, depth + 0.4),
      new THREE.MeshStandardMaterial({ color: 0x1d2d44, roughness: 0.5 })
    );
    roof.position.y = height + 0.2;
    group.add(roof);

    // Door
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(1.4, 2.4, 0.1),
      new THREE.MeshStandardMaterial({ color: 0x3d2612 })
    );
    door.position.set(0, 1.2, depth / 2 + 0.05);
    group.add(door);

    // Warm indoor glow window
    const windowLight = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, 1.4, 0.1),
      new THREE.MeshBasicMaterial({ color: 0xffe066 })
    );
    windowLight.position.set(width / 4, height / 1.8, depth / 2 + 0.05);
    group.add(windowLight);

    return group;
  }

  async function addBuilding(filename, x, z, rotation = 0, label = "Building") {
    let root;
    try {
      const url = "./" + encodeURIComponent(filename);
      root = await loadGLB(url);
      const bounds = new THREE.Box3().setFromObject(root);
      const center = bounds.getCenter(new THREE.Vector3());
      root.position.x -= center.x;
      root.position.z -= center.z;

      const size = bounds.getSize(new THREE.Vector3());
      const footprint = Math.max(size.x, size.z);
      const scale = Math.min(1.25, 7.0 / Math.max(footprint, 0.001));
      root.scale.setScalar(scale);

      const afterScale = new THREE.Box3().setFromObject(root);
      root.position.y -= afterScale.min.y;
    } catch (error) {
      failedAssets.push(filename);
      root = createProceduralBuildingMesh(filename, label);
    }

    root.position.set(x, 0, z);
    root.rotation.y = rotation;
    root.userData.cityBuilding = label;

    scene.add(root);
    buildingRoots.push(root);
    return root;
  }

  // Fences & Parking Lot
  function addParkingLot() {
    const pad = new THREE.Mesh(
      new THREE.BoxGeometry(15, 0.16, 10),
      new THREE.MeshStandardMaterial({ color: 0x44484a, roughness: 1 })
    );
    pad.position.set(-38, -0.04, 1);
    pad.receiveShadow = true;
    scene.add(pad);

    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xf2f0df });
    for (let i = 0; i < 4; i++) {
      const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.025, 4.8), whiteMat);
      stripe.position.set(-43.2 + i * 3.1, 0.055, 1);
      scene.add(stripe);
    }
  }

  function addFenceLine(x, zStart, zEnd) {
    const length = Math.abs(zEnd - zStart);
    const group = new THREE.Group();
    const postMat = new THREE.MeshStandardMaterial({ color: 0x6a5742 });
    const railMat = new THREE.MeshStandardMaterial({ color: 0x8a765b });
    const count = Math.max(2, Math.floor(length / 2.5));

    for (let i = 0; i <= count; i++) {
      const z = -length / 2 + (length * i) / count;
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.15, 0.16), postMat);
      post.position.set(0, 0.575, z);
      group.add(post);
    }

    for (const y of [0.42, 0.85]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, length), railMat);
      rail.position.set(0, y, 0);
      group.add(rail);
    }
    group.position.set(x, 0, (zStart + zEnd) / 2);
    scene.add(group);
  }

  // Street Trees
  function addTree(x, z, s = 1) {
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18 * s, 0.24 * s, 2.2 * s, 7),
      new THREE.MeshStandardMaterial({ color: 0x523d2b })
    );
    trunk.position.set(x, 1.1 * s, z);
    trunk.castShadow = true;
    scene.add(trunk);

    const crown = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.15 * s, 1),
      new THREE.MeshStandardMaterial({ color: 0x2d4d32 })
    );
    crown.position.set(x, 2.65 * s, z);
    crown.castShadow = true;
    scene.add(crown);
  }

  // ========================================
  // BUILD THE FULL CITY
  // ========================================

  async function buildCity() {
    let loadedRoads = 0;
    status.textContent = "Building road layout...";

    for (const r of savedRoads) {
      await addRoad(r.type, r.x, r.z, r.rot, r.y);
      loadedRoads++;
      status.textContent = `Roads: ${loadedRoads}/36`;
    }

    // Streetlights
    const lightPositions = [
      [-24, 5], [17.6, 5], [-12, 5], [6, 5],
      [-20, 20], [25, 20], [-20, -12], [24, -12],
      [-12, 26], [6, 26], [-12, -22], [6, -22]
    ];
    lightPositions.forEach(p => createStreetLamp(p[0], p[1]));

    status.textContent = "Placing houses & Tina's bakery...";

    const homes = [
      ["MS_HV_01_PorchBungalow.glb", -12, 15, 0],
      ["MS_HV_02_WideBalconyHouse.glb", -12, 6, 0],
      ["MS_HV_03_UrbanTownhouse.glb", -12, -3, 0],
      ["MS_HV_04_CornerEntryHouse.glb", -12, -12, 0],
      ["MS_HV_05_GatedCarportHouse.glb", 32, 15, Math.PI],
      ["MS_HV_06_OlderDuplexRental.glb", 32, 6, Math.PI],
      ["MS_PF_01_TwoStoreyHouse.glb", 32, -3, Math.PI],
      ["MS_PF_02_NarrowTownhouse.glb", 32, -12, Math.PI],
      ["MS_PF_03_ThreeStoreyApartment.glb", -14, 34, Math.PI],
      ["MS_PF_04_ApartmentBlock.glb", -4, 34, Math.PI],
      ["MS_RR_A01_TinySingleRoom.glb", 6, 34, Math.PI],
      ["MS_RR_A02_BudgetHouse.glb", 16, 34, Math.PI],
      ["MS_RR_B02_StandardFamilyBungalow.glb", -13, -30, 0],
      ["MS_RR_D01_StudioUnit.glb", -3, -30, 0],
      ["MS_RR_D04_BoardingHouse.glb", 8, -30, 0]
    ];

    for (let i = 0; i < homes.length; i++) {
      const [file, x, z, rot] = homes[i];
      await addBuilding(file, x, z, rot, "Home " + (i + 1));
    }

    // Shops & Bakery
    await addBuilding("MS_PF_05_CornerShop.glb", -37, 9, Math.PI / 2, "Corner shop");
    await addBuilding("MS_PF_06_ClosedStorefront.glb", -5, -8, 0, "Storefront");
    await addBuilding("tinas bakery.glb", 8, -8, 0, "Tina's bakery");

    // Extras
    addParkingLot();
    addFenceLine(-28, -15, 22);
    addFenceLine(16, -15, 22);

    [
      [-34, 18], [-34, -15], [38, 18], [38, -15],
      [-27, 34], [24, 34], [-27, -32], [24, -32]
    ].forEach(p => addTree(p[0], p[1], 0.9));

    status.textContent = `City preview loaded!
  36 saved road pieces
  15 houses + shops + Tina's bakery
  Midnight lighting & Walk mode ready.`;
  }

  // ========================================
  // CONTROLS & FPS INTERACTION
  // ========================================

  document.getElementById("overview").onclick = () => {
    isFpsMode = false;
    if (document.exitPointerLock) document.exitPointerLock();
    crosshair.style.display = "none";
    controls.enabled = true;
    camera.position.set(64, 65, 76);
    controls.target.set(0, 1, 3);
    controls.update();
  };

  document.getElementById("fpsMode").onclick = () => {
    renderer.domElement.requestPointerLock();
  };

  document.addEventListener("pointerlockchange", () => {
    if (document.pointerLockElement === renderer.domElement) {
      isFpsMode = true;
      controls.enabled = false;
      crosshair.style.display = "block";
      player.position.set(0, 1.7, 10);
    } else {
      isFpsMode = false;
      controls.enabled = true;
      crosshair.style.display = "none";
    }
  });

  document.addEventListener("keydown", e => { keysPressed[e.code] = true; });
  document.addEventListener("keyup", e => { keysPressed[e.code] = false; });

  document.addEventListener("mousemove", e => {
    if (!isFpsMode) return;
    const sensitivity = 0.0022;
    player.yaw -= e.movementX * sensitivity;
    player.pitch -= e.movementY * sensitivity;
    player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));
  });

  document.getElementById("btnMidnight").onclick = () => setAtmosphere('midnight');
  document.getElementById("btnSunset").onclick = () => setAtmosphere('sunset');
  document.getElementById("btnDay").onclick = () => setAtmosphere('day');

  // ========================================
  // ANIMATION LOOP
  // ========================================

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();

    if (isFpsMode) {
      const moveDir = new THREE.Vector3();
      if (keysPressed["KeyW"] || keysPressed["ArrowUp"]) moveDir.z -= 1;
      if (keysPressed["KeyS"] || keysPressed["ArrowDown"]) moveDir.z += 1;
      if (keysPressed["KeyA"] || keysPressed["ArrowLeft"]) moveDir.x -= 1;
      if (keysPressed["KeyD"] || keysPressed["ArrowRight"]) moveDir.x += 1;
      moveDir.normalize();

      const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw)).negate();
      const right = new THREE.Vector3(forward.z, 0, -forward.x);

      const moveVector = new THREE.Vector3()
        .addScaledVector(forward, moveDir.z)
        .addScaledVector(right, moveDir.x);

      player.position.addScaledVector(moveVector, player.speed * delta);
      camera.position.copy(player.position);

      const target = new THREE.Vector3(
        player.position.x + Math.sin(player.yaw) * Math.cos(player.pitch),
        player.position.y + Math.sin(player.pitch),
        player.position.z + Math.cos(player.yaw) * Math.cos(player.pitch)
      );
      camera.lookAt(target);
    } else {
      controls.update();
    }

    renderer.render(scene, camera);
  }

  // Start
  buildCity();
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>

  </body>
  </html>
