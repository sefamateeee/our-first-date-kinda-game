// ========================================
// ORIGINAL ROAD LOADING METHOD
// ========================================

async function addRoad(
type,
x,
z,
rotation=0,
y=0.16
) {

const model = await loadGLB(
roadFolder+roadFiles[type]
);

// Preserve the original editor's centering method.

const bounds = new THREE.Box3().setFromObject(model);

const center = bounds.getCenter(
new THREE.Vector3()
);

model.position.x -= center.x;

model.position.z -= center.z;

const adjusted = new THREE.Box3().setFromObject(model);

model.position.y -= adjusted.min.y;

// Store the actual local road dimensions before rotation.

model.updateMatrixWorld(true);

const localBounds = new THREE.Box3().setFromObject(model);

model.userData.localRoadSize =
localBounds.getSize(new THREE.Vector3());

model.userData.localRoadTop = localBounds.max.y;

model.position.x += x;

model.position.z += z;

model.position.y += y;

model.rotation.y = rotation;

model.userData.roadType = type;

enableShadows(model);

scene.add(model);

roads.push(model);

return model;

}


// ========================================
// NORMALISE MARKING ASSETS
// ========================================

function normaliseAsset(root) {

const bounds = new THREE.Box3().setFromObject(root);

const center = bounds.getCenter(
new THREE.Vector3()
);

root.position.x -= center.x;

root.position.z -= center.z;

const adjusted = new THREE.Box3().setFromObject(root);

root.position.y -= adjusted.min.y;

root.updateMatrixWorld(true);

return new THREE.Box3().setFromObject(root);

}


// ========================================
// ATTACH MARKINGS TO ROAD PIECES
// ========================================

async function addOverlayToRoad(
parent,
filename,
options={}
) {

const root = await loadGLB(
roadFolder+filename
);

const markBounds = normaliseAsset(root);

const markSize = markBounds.getSize(
new THREE.Vector3()
);

const roadSize = parent.userData.localRoadSize;

// Fit the marking to the road's actual dimensions.

const sx = roadSize.x / Math.max(markSize.x,0.001);

const sz = roadSize.z / Math.max(markSize.z,0.001);

root.scale.set(sx,1,sz);

root.position.y =
parent.userData.localRoadTop +
(options.lift ?? 0.012);

root.position.x = options.x ?? 0;

root.position.z = options.z ?? 0;

root.rotation.y = options.rotation ?? 0;

parent.add(root);

enableShadows(root);

return root;

}

sidewalk.receiveShadow = true;

parent.add(sidewalk);

}


// ========================================
// FENCES
// ========================================

function addFenceLine(x,zStart,zEnd) {

const group = new THREE.Group();

const length = Math.abs(zEnd-zStart);

const postMat = new THREE.MeshStandardMaterial({
color:0x6a5742
});

const railMat = new THREE.MeshStandardMaterial({
color:0x8a765b
});

const postGeo = new THREE.BoxGeometry(
0.16,
1.15,
0.16
);

const railGeo = new THREE.BoxGeometry(
0.12,
0.12,
length
);

const count = Math.max(
2,
Math.floor(length/2.5)
);

for(let i=0;i<=count;i++) {

const z = -length/2 + length*i/count;

const post = new THREE.Mesh(postGeo,postMat);

post.position.set(0,0.575,z);

group.add(post);

}

for(const y of [0.42,0.85]) {

const rail = new THREE.Mesh(railGeo,railMat);

rail.position.set(0,y,0);

group.add(rail);

}

group.position.set(
x,
0,
(zStart+zEnd)/2
);

scene.add(group);

}


function addFenceHorizontal(xStart,xEnd,z) {

const length = xEnd-xStart;

const group = new THREE.Group();

const postMat = new THREE.MeshStandardMaterial({
color:0x6a5742
});

const railMat = new THREE.MeshStandardMaterial({
color:0x8a765b
});

const postGeo = new THREE.BoxGeometry(
0.16,
1.15,
0.16
);

const count = Math.max(
2,
Math.floor(length/2.5)
);

for(let i=0;i<=count;i++) {

const x = -length/2 + length*i/count;

const post = new THREE.Mesh(postGeo,postMat);

post.position.set(x,0.575,0);

group.add(post);

}

for(const y of [0.42,0.85]) {

const rail = new THREE.Mesh(
new THREE.BoxGeometry(length,0.12,0.12),
railMat
);

rail.position.set(0,y,0);

group.add(rail);

}

group.position.set(
(xStart+xEnd)/2,
0,
z
);

scene.add(group);

}


// ========================================
// BUILDING LOADER
// ========================================

async function addBuilding(
filename,
x,
z,
rotation=0,
label="Building"
) {

try {

const url = "./"+encodeURIComponent(filename);

const root = await loadGLB(url);

let bounds = normaliseAsset(root);

const size = bounds.getSize(
new THREE.Vector3()
);

// Keep the buildings at neighbourhood scale.

const footprint = Math.max(size.x,size.z);

const scale = Math.min(
1.25,
7.0/Math.max(footprint,0.001)
);

root.scale.setScalar(scale);

root.updateMatrixWorld(true);

bounds = new THREE.Box3().setFromObject(root);

const center = bounds.getCenter(
new THREE.Vector3()
);

root.position.x -= center.x;

root.position.z -= center.z;

const afterScale = new THREE.Box3().setFromObject(root);

root.position.y -= afterScale.min.y;

root.position.x += x;

root.position.z += z;

root.rotation.y = rotation;

root.userData.cityBuilding = label;

enableShadows(root);

scene.add(root);

buildingRoots.push(root);

return root;

} catch(error) {

failedAssets.push(filename);

console.warn(
"Could not load building:",
filename,
error
);

return null;

}

}

// ========================================
// BUILD THE FULL CITY
// ========================================

async function buildCity() {

let loadedRoads = 0;

status.textContent =
"Loading your exact road layout...";

// --------------------------------------
// LOAD YOUR 36 ROADS
// --------------------------------------

for(const r of savedRoads) {

const model = await addRoad(
r.type,
r.x,
r.z,
r.rot,
r.y
);

model.userData.savedId = r.id;

loadedRoads++;

status.textContent =
`Roads: ${loadedRoads}/36`;

}


// --------------------------------------
// WHITE DASHED CENTRE LINES
// --------------------------------------

status.textContent =
"Adding white centre lines and crossings...";

for(const road of roads) {

if(road.userData.roadType==="straight") {

await addOverlayToRoad(
road,
"MS_RD_20_DashedCenter.glb"
);

}

}


// --------------------------------------
// CROSSWALKS
// --------------------------------------

// Put crosswalks on the straight approach pieces,
// not stretched across the large junction models.

const crosswalkApproaches = roads.filter(r=>

r.userData.roadType==="straight" &&

Math.abs(r.position.z-2)<0.1 &&

(
Math.abs(r.position.x+18)<0.1 ||
Math.abs(r.position.x-12)<0.1
)

);

for(const road of crosswalkApproaches) {

await addOverlayToRoad(
road,
"MS_RD_10_Crosswalk.glb",
{lift:0.018}
);

}


// --------------------------------------
// STOP LINES
// --------------------------------------

const stopApproaches = roads.filter(r=>

r.userData.roadType==="straight" &&

Math.abs(r.position.z-2)<0.1 &&

(
Math.abs(r.position.x+12)<0.1 ||
Math.abs(r.position.x-6)<0.1
)

);

for(const road of stopApproaches) {

await addOverlayToRoad(
road,
"MS_RD_20_StopLine.glb",
{lift:0.022}
);

}


// --------------------------------------
// YELLOW BUS STOP LINE
// --------------------------------------

const busStopRoad = roads.find(r=>

r.userData.roadType==="straight" &&

Math.abs(r.position.x-6)<0.1 &&

Math.abs(r.position.z-2)<0.1

);

if(busStopRoad) {

addYellowBusStopLine(busStopRoad);

}


// --------------------------------------
// SIDEWALKS
// --------------------------------------

for(const road of roads) {

if(road.userData.roadType==="straight") {

addSidewalkStrip(road,1);

addSidewalkStrip(road,-1);

}

}


// --------------------------------------
// ALL 15 RESIDENTIAL HOUSES
// --------------------------------------

status.textContent =
"Placing all houses, shops and Tina's bakery...";

const homes = [

["MS_HV_01_PorchBungalow.glb",-12,15,0],

["MS_HV_02_WideBalconyHouse.glb",-12,6,0],

["MS_HV_03_UrbanTownhouse.glb",-12,-3,0],

["MS_HV_04_CornerEntryHouse.glb",-12,-12,0],

["MS_HV_05_GatedCarportHouse.glb",32,15,Math.PI],

["MS_HV_06_OlderDuplexRental.glb",32,6,Math.PI],

["MS_PF_01_TwoStoreyHouse.glb",32,-3,Math.PI],

["MS_PF_02_NarrowTownhouse.glb",32,-12,Math.PI],

["MS_PF_03_ThreeStoreyApartment.glb",-14,34,Math.PI],

["MS_PF_04_ApartmentBlock.glb",-4,34,Math.PI],

["MS_RR_A01_TinySingleRoom.glb",6,34,Math.PI],

["MS_RR_A02_BudgetHouse.glb",16,34,Math.PI],

["MS_RR_B02_StandardFamilyBungalow.glb",-13,-30,0],

["MS_RR_D01_StudioUnit.glb",-3,-30,0],

["MS_RR_D04_BoardingHouse.glb",8,-30,0]

];


for(let i=0;i<homes.length;i++) {

const [file,x,z,rot] = homes[i];

await addBuilding(
file,
x,
z,
rot,
"Home "+(i+1)
);

status.textContent =
`Buildings: ${i+1}/18`;

}


// --------------------------------------
// SHOPS AND TINA'S BAKERY
// --------------------------------------

await addBuilding(
"MS_PF_05_CornerShop.glb",
-37,
9,
Math.PI/2,
"Corner shop"
);

await addBuilding(
"MS_PF_06_ClosedStorefront.glb",
-5,
-8,
0,
"Storefront"
);

await addBuilding(
"tinas bakery.glb",
8,
-8,
0,
"Tina's bakery"
);


// --------------------------------------
// PARKING LOT
// --------------------------------------

addParkingLot();


// --------------------------------------
// RESIDENTIAL FENCES
// --------------------------------------

addFenceLine(-28,-15,22);

addFenceLine(16,-15,22);

addFenceHorizontal(-18,18,18);

addFenceHorizontal(-18,18,-14);


// --------------------------------------
// STREET TREES
// --------------------------------------

const treeMat = new THREE.MeshStandardMaterial({
color:0x416b45
});

const trunkMat = new THREE.MeshStandardMaterial({
color:0x66503b
});


function addTree(x,z,s=1) {

const trunk = new THREE.Mesh(

new THREE.CylinderGeometry(
0.18*s,
0.24*s,
2.2*s,
7
),

trunkMat

);

trunk.position.set(x,1.1*s,z);

trunk.castShadow = true;

scene.add(trunk);


const crown = new THREE.Mesh(

new THREE.IcosahedronGeometry(
1.15*s,
1
),

treeMat

);

crown.position.set(x,2.65*s,z);

crown.castShadow = true;

scene.add(crown);

}


[

[-34,18],
[-34,-15],
[38,18],
[38,-15],
[-27,34],
[24,34],
[-27,-32],
[24,-32],
[-4,13],
[10,13],
[-4,-13],
[10,-13]

].forEach(p => addTree(p[0],p[1],0.9));

// CAMERA POSITION
// --------------------------------------

controls.target.set(0,1,3);

camera.position.set(64,65,76);

controls.update();


// --------------------------------------
// LOADING REPORT
// --------------------------------------

const failedText = failedAssets.length

? "\nFiles not found:\n"+failedAssets.join("\n")

: "";


status.textContent =

`City preview loaded.
36 saved road pieces
15 houses + 2 shop shells + Tina's bakery
Road markings, crossings, sidewalks, fences and parking lot`+

failedText;

}


// ========================================
// CAMERA BUTTONS
// ========================================

controls.target.set(0,1,3);

camera.position.set(64,65,76);

controls.update();

};


document.getElementById("street").onclick = () => {

camera.position.set(-8,12,17);

controls.update();

};


// ========================================
// START CITY
// ========================================

buildCity().catch(error => {

console.error(error);

status.textContent =
"City loading stopped: "+error.message+
"\nCheck the filenames in the GitHub repository.";

});


// ========================================
// ANIMATION
// ========================================

function animate() {

requestAnimationFrame(animate);

controls.update();

renderer.render(scene,camera);

}

animate();


// ========================================

// ========================================

camera.aspect = innerWidth/innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);
