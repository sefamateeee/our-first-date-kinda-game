<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our First Date — City Editor</title>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
}
}
</script>

<style>
* { box-sizing: border-box; }

html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #18221c;
font-family: Arial, sans-serif;
}

canvas {
display: block;
touch-action: none;
}

#panel {
position: fixed;
z-index: 5;
top: 12px;
left: 12px;
width: 280px;
max-height: calc(100vh - 24px);
overflow: auto;
padding: 14px;
background: #18231eef;
color: #f4f0e4;
border: 1px solid #8eaa8c;
border-radius: 12px;
box-shadow: 0 8px 30px #0007;
}

h1 {
font-size: 17px;
margin: 0 0 6px;
color: #f4d9a5;
}

p {
font-size: 12px;
line-height: 1.45;
color: #d7dfd2;
}

label {
display: block;
font-size: 12px;
margin: 10px 0 5px;
}

select, button {
font: 13px Arial;
border-radius: 7px;
border: 1px solid #9aac91;
padding: 8px;
background: #e8e3d4;
color: #1c2a20;
}

select { width: 100%; }

button {
cursor: pointer;
margin: 3px 2px;
}

button:hover { background: #f6dba7; }

.row {
display: flex;
flex-wrap: wrap;
gap: 4px;
}

.row button {
flex: 1;
min-width: 58px;
}

#status {
font-size: 11px;
color: #b9d8b2;
white-space: pre-wrap;
margin-top: 9px;
}

#help {
position: fixed;
right: 12px;
bottom: 12px;
z-index: 4;
padding: 9px 12px;
border-radius: 9px;
background: #18231edb;
color: #f4f0e4;
font-size: 12px;
line-height: 1.55;
pointer-events: none;
}

#toggle {
position: fixed;
z-index: 6;
top: 12px;
right: 12px;
}

.hidden { display: none !important; }
</style>
</head>

<body>

<div id="panel">

<h1>OUR CITY — EDITOR</h1>

<p>
Updated compact city layout.
Arrange the buildings using the controls below.
Your road layout is preserved.
</p>

<label>Choose a building to move</label>
<select id="buildingSelect">
<option value="">Loading buildings...</option>
</select>

<label>Move selected building</label>

<div class="row">
<button data-move="0,-1">↑ North</button>
<button data-move="0,1">↓ South</button>
</div>

<div class="row">
<button data-move="-1,0">← West</button>
<button data-move="1,0">East →</button>
</div>

<div class="row">
<button data-move="0,-0.25">Fine ↑</button>
<button data-move="0,0.25">Fine ↓</button>
</div>

<div class="row">
<button id="rotateLeft">Rotate ↶</button>
<button id="rotateRight">Rotate ↷</button>
</div>

<div class="row">
<button id="resetSelected">Reset selected</button>
<button id="resetAll">Reset all</button>
</div>

<div class="row">
<button id="save">Save layout</button>
<button id="clearSave">Clear saved</button>
</div>

<div id="status">Loading city assets...</div>

</div>

<button id="toggle">Hide panel</button>

<div id="help">
LEFT DRAG — orbit camera<br>
RIGHT DRAG — pan view<br>
SCROLL — zoom in / out<br>
Use the panel to move buildings
</div>

<script type="module">

import * as THREE from 'three';

import {
GLTFLoader
} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

import {
OrbitControls
} from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';


const status = document.getElementById('status');
const loader = new GLTFLoader();

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xb9c9d0);
scene.fog = new THREE.Fog(0xb9c9d0, 150, 300);


// CAMERA

const camera = new THREE.PerspectiveCamera(
48,
innerWidth / innerHeight,
0.1,
600
);

camera.position.set(62, 72, 78);


// RENDERER

const renderer = new THREE.WebGLRenderer({
antialias: true
});

renderer.setSize(innerWidth, innerHeight);

renderer.setPixelRatio(
Math.min(devicePixelRatio, 1.7)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


// CAMERA CONTROLS

const controls = new OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.075;

controls.enableRotate = true;
controls.enablePan = true;
controls.enableZoom = true;

controls.mouseButtons = {
LEFT: THREE.MOUSE.ROTATE,
MIDDLE: THREE.MOUSE.DOLLY,
RIGHT: THREE.MOUSE.PAN
};

controls.minDistance = 34;
controls.maxDistance = 145;

controls.minPolarAngle = 0.18;
controls.maxPolarAngle = 1.48;

controls.target.set(0, 0, 3);
controls.screenSpacePanning = true;

renderer.domElement.addEventListener(
'contextmenu',
e => e.preventDefault()
);


// LIGHTING

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x65745c,
2.0
)
);

const sun = new THREE.DirectionalLight(
0xfff0d8,
3.1
);

sun.position.set(-45, 75, -30);
sun.castShadow = true;

sun.shadow.mapSize.set(2048, 2048);

sun.shadow.camera.left = -85;
sun.shadow.camera.right = 85;
sun.shadow.camera.top = 85;
sun.shadow.camera.bottom = -85;

scene.add(sun);

const fill = new THREE.DirectionalLight(
0xffffff,
1.15
);

fill.position.set(35, 35, 45);
scene.add(fill);


// GRASS GROUND

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(240, 220),
new THREE.MeshStandardMaterial({
color: 0x71915d,
roughness: 1
})
);

ground.rotation.x = -Math.PI / 2;
ground.position.set(0, -0.12, 3);
ground.receiveShadow = true;

scene.add(ground);


// SUBTLE EDITOR GRID

const grid = new THREE.GridHelper(
180,
90,
0x82947a,
0x9aaa91
);

grid.position.set(0, -0.105, 3);
grid.material.opacity = 0.2;
grid.material.transparent = true;

scene.add(grid);


// ROAD ASSETS

const roadFiles = {
straight: 'MS_RD_01_StraightRoad.glb',
corner: 'MS_RD_02_RoadCorner90.glb',
crossroads: 'MS_RD_04_Crossroads.glb',
transition64: 'MS_RD_06_Transition_6to4.glb'
};


// ORIGINAL SAVED ROAD POSITIONS
// All 36 road pieces retained.
// Corner 21 has been nudged slightly toward the upper road.

const savedRoads = [

[1,'crossroads',-27.429,.16,5,0],
[2,'crossroads',17.6,.16,5,0],

[3,'straight',-18,.16,2,0],
[4,'straight',-12,.16,2,0],
[5,'straight',-6,.16,2,0],
[6,'straight',0,.16,2,0],
[7,'straight',6,.16,2,0],
[8,'straight',12,.16,2,0],

[9,'transition64',-19.622,.16,4.504,3.142],
[10,'straight',-20.626,.16,14,1.571],
[11,'straight',-20.646,.16,20,1.571],

[12,'transition64',-25.784,.16,-5,0],
[13,'straight',-20.903,.16,-6.391,1.571],
[14,'straight',-20.882,.16,-12.266,1.571],

[15,'transition64',26.123,.16,4.22,3.142],
[16,'straight',25.101,.16,14.193,1.571],
[17,'straight',25.094,.16,20,1.571],

[18,'transition64',19.453,.16,-5,0],
[19,'straight',24.375,.16,-8.602,1.571],
[20,'straight',24.392,.16,-14.162,1.571],

[21,'corner',-17.172,.16,19.734,-.032],
[22,'corner',17.379,.16,18.001,-1.557],

[23,'straight',-18,.16,26,0],
[24,'straight',-12,.16,26,0],
[25,'straight',-6,.16,26,0],
[26,'straight',0,.16,26,0],
[27,'straight',6,.16,26,0],
[28,'straight',12,.16,26,0],

[29,'corner',-16.874,.16,-18.121,1.547],
[30,'corner',16.833,.173,-18.225,-.01],

[31,'straight',-18,.16,-22,0],
[32,'straight',-12,.16,-22,0],
[33,'straight',-6,.16,-22,0],
[34,'straight',0,.16,-22,0],
[35,'straight',6,.16,-22,0],
[36,'straight',12,.16,-22,0]

];


// NORMALISE MODEL ORIGIN

function normalizeModel(root) {

const box = new THREE.Box3().setFromObject(root);

const center = box.getCenter(
new THREE.Vector3()
);

root.position.x -= center.x;
root.position.z -= center.z;

const after = new THREE.Box3().setFromObject(root);

root.position.y -= after.min.y;

root.traverse(o => {
if (o.isMesh) {
o.castShadow = true;
o.receiveShadow = true;
}
});

return root;
}


// FALLBACK ROAD

function fallbackRoad() {

const group = new THREE.Group();

const road = new THREE.Mesh(
new THREE.BoxGeometry(6, 0.16, 6),
new THREE.MeshStandardMaterial({
color: 0x343638,
roughness: 0.96
})
);

road.position.y = 0.08;
road.receiveShadow = true;

group.add(road);

return group;
}


// LOAD ROAD PIECES

const roadModels = [];

for (const r of savedRoads) {

const [id,type,x,y,z,rot] = r;

let model;

try {

const gltf = await loader.loadAsync(
'./city-assets/roads/' + roadFiles[type]
);

model = normalizeModel(gltf.scene);

} catch (e) {

console.warn('Road asset missing:', roadFiles[type]);

model = fallbackRoad();

}

model.position.set(x,y,z);
model.rotation.y = rot;

scene.add(model);
roadModels.push(model);

}


// BUILDING FILES

const buildingFiles = [

'MS_HV_01_PorchBungalow.glb',
'MS_HV_02_WideBalconyHouse.glb',
'MS_HV_03_UrbanTownhouse.glb',
'MS_HV_04_CornerEntryHouse.glb',
'MS_HV_05_GatedCarportHouse.glb',
'MS_HV_06_OlderDuplexRental.glb',

'MS_PF_01_TwoStoreyHouse.glb',
'MS_PF_02_NarrowTownhouse.glb',
'MS_PF_03_ThreeStoreyApartment.glb',
'MS_PF_04_ApartmentBlock.glb',
'MS_PF_05_CornerShop.glb',
'MS_PF_06_ClosedStorefront.glb',

'MS_RR_A01_TinySingleRoom.glb',
'MS_RR_A02_BudgetHouse.glb',
'MS_RR_B02_StandardFamilyBungalow.glb',
'MS_RR_D01_StudioUnit.glb',
'MS_RR_D04_BoardingHouse.glb',

'tinas bakery.glb'

];


// COMPACT BUILDING POSITIONS
// The spacing is tighter than the previous layout.
// Buildings are scaled to a maximum footprint of 5.6 units.
// Slots are 7 units apart to leave room between buildings.

const compactSpots = [

[-14,10],
[-7,10],
[0,10],
[7,10],

[-14,16.5],
[-7,16.5],
[0,16.5],
[7,16.5],

[-14,-6],
[-7,-6],
[0,-6],
[7,-6],

[-14,-12.5],
[-7,-12.5],
[0,-12.5],
[7,-12.5],

[14,-6]

];


// THE CORNER SHOP IS RESERVED FOR THE SPAWN STORE.
// The other buildings use the compact residential positions.

const shopIndex = 10;

const shopPosition = [-42,16];


// FALLBACK BUILDING

function fallbackBuilding(name) {

const group = new THREE.Group();

const apartment =
/Apartment|Boarding|Studio|Budget/i.test(name);

const shop =
/Shop|Storefront|bakery/i.test(name);

const w = shop ? 6.2 : 5.3;
const d = shop ? 5.4 : 5.6;
const h = apartment ? 7.2 : 5.0;

const body = new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({
color: shop ? 0xb7a078 : 0xc5a98c,
roughness: 0.9
})
);

body.position.y = h / 2;
body.castShadow = true;
body.receiveShadow = true;

group.add(body);

const roof = new THREE.Mesh(
new THREE.BoxGeometry(w+0.25,0.3,d+0.25),
new THREE.MeshStandardMaterial({
color: 0x51443a
})
);

roof.position.y = h + 0.15;
group.add(roof);

return group;
}


// LOAD BUILDINGS

const buildingEntries = [];

for (let i = 0; i < buildingFiles.length; i++) {

const file = buildingFiles[i];

let root;
let real = true;

try {

const gltf = await loader.loadAsync(
'./' + encodeURIComponent(file)
);

root = normalizeModel(gltf.scene);

} catch (e) {

console.warn('Building asset missing:', file);

real = false;
root = fallbackBuilding(file);

}


// FIT LARGE BUILDINGS INTO THE COMPACT LAYOUT

const box = new THREE.Box3().setFromObject(root);

const size = box.getSize(
new THREE.Vector3()
);

const footprint = Math.max(size.x,size.z);

const scale = Math.min(
1,
5.6 / Math.max(footprint,0.001)
);

root.scale.setScalar(scale);
root.updateMatrixWorld(true);

const after = new THREE.Box3().setFromObject(root);

root.position.y -= after.min.y;


// POSITION THE STORE SEPARATELY

let spot;

if (i === shopIndex) {

spot = shopPosition;

} else {

const compactIndex = i < shopIndex ? i : i - 1;

spot = compactSpots[compactIndex] || [14,-13];

}

root.position.set(spot[0],0,spot[1]);

root.userData.editorName = file;
root.userData.file = file;
root.userData.realAsset = real;

root.traverse(o => {

if (o.isMesh) {
o.castShadow = true;
o.receiveShadow = true;
}

});

scene.add(root);

buildingEntries.push({

file,
root,
start: root.position.clone(),
startRotation: 0

});

}


// CAR PARK OUTSIDE THE SPAWN STORE

const carPark = new THREE.Group();

const asphaltMaterial = new THREE.MeshStandardMaterial({
color: 0x393d3e,
roughness: 0.98
});

const parkingLineMaterial = new THREE.MeshStandardMaterial({
color: 0xe8e5d7,
roughness: 0.9
});


// Main asphalt parking area

const parkingSurface = new THREE.Mesh(
new THREE.BoxGeometry(16,0.12,7),
asphaltMaterial
);

parkingSurface.position.set(-42,0.015,8.5);
parkingSurface.receiveShadow = true;

carPark.add(parkingSurface);


// Parking bay divider lines

for (let i = 0; i <= 6; i++) {

const line = new THREE.Mesh(
new THREE.BoxGeometry(0.075,0.025,4.8),
parkingLineMaterial
);

line.position.set(
-49.2 + i * 2.4,
0.09,
8.5
);

carPark.add(line);

}


// Back edge of parking bays

const backLine = new THREE.Mesh(
new THREE.BoxGeometry(14.4,0.025,0.075),
parkingLineMaterial
);

backLine.position.set(-42,0.09,10.9);

carPark.add(backLine);


// Small access strip between the car park and road

const driveway = new THREE.Mesh(
new THREE.BoxGeometry(6,0.1,2.2),
asphaltMaterial
);

driveway.position.set(-42,0.025,3.9);
driveway.receiveShadow = true;

carPark.add(driveway);


// Add a small pedestrian path beside the parking area

const footpath = new THREE.Mesh(
new THREE.BoxGeometry(2,0.12,7),
new THREE.MeshStandardMaterial({
color: 0xaaa99c,
roughness: 1
})
);

footpath.position.set(-32.8,0.025,8.5);
footpath.receiveShadow = true;

carPark.add(footpath);

scene.add(carPark);


// BUILDING SELECTOR

const select = document.getElementById('buildingSelect');

select.innerHTML = '';

buildingEntries.forEach((entry,i) => {

const opt = document.createElement('option');

opt.value = String(i);

opt.textContent =
entry.file === buildingFiles[shopIndex]
? entry.file + ' — SPAWN STORE'
: entry.file;

select.append(opt);

});


let selectedIndex = 0;

select.addEventListener('change', () => {
selectedIndex = Number(select.value);
});


function selected() {
return buildingEntries[selectedIndex];
}


// MOVE BUILDING

function moveSelected(dx,dz) {

const e = selected();

if (!e) return;

e.root.position.x += dx;
e.root.position.z += dz;

}


document.querySelectorAll('[data-move]').forEach(btn => {

btn.addEventListener('click', () => {

const [x,z] = btn.dataset.move
.split(',')
.map(Number);

moveSelected(x,z);

});

});


// ROTATION

document.getElementById('rotateLeft').onclick = () => {

const e = selected();

if (e) e.root.rotation.y -= Math.PI / 2;

};

document.getElementById('rotateRight').onclick = () => {

const e = selected();

if (e) e.root.rotation.y += Math.PI / 2;

};


// RESET SELECTED

document.getElementById('resetSelected').onclick = () => {

const e = selected();

if (e) {

e.root.position.copy(e.start);
e.root.rotation.y = e.startRotation;

}

};


// RESET ALL

document.getElementById('resetAll').onclick = () => {

buildingEntries.forEach(e => {

e.root.position.copy(e.start);
e.root.rotation.y = e.startRotation;

});

};


// SAVE LAYOUT

const SAVE_KEY = 'ofd_city_editor_layout_v3';

document.getElementById('save').onclick = () => {

const data = buildingEntries.map(e => ({

file: e.file,

x: e.root.position.x,

z: e.root.position.z,

rotation: e.root.rotation.y

}));

localStorage.setItem(
SAVE_KEY,
JSON.stringify(data)
);

status.textContent =
'Saved your updated building arrangement in this browser.';

};


// CLEAR SAVED LAYOUT

document.getElementById('clearSave').onclick = () => {

localStorage.removeItem(SAVE_KEY);

status.textContent =
'Saved arrangement cleared. Reload to restore the new starting layout.';

};


// LOAD SAVED LAYOUT

try {

const saved = JSON.parse(
localStorage.getItem(SAVE_KEY) || 'null'
);

if (Array.isArray(saved)) {

for (const item of saved) {

const e = buildingEntries.find(
v => v.file === item.file
);

if (e) {

e.root.position.set(item.x,0,item.z);

e.root.rotation.y = item.rotation || 0;

}

}

}

} catch(e) {}


// PANEL TOGGLE

document.getElementById('toggle').onclick = () => {

const panel = document.getElementById('panel');

panel.classList.toggle('hidden');

document.getElementById('toggle').textContent =
panel.classList.contains('hidden')
? 'Show panel'
: 'Hide panel';

};


// STATUS

const missing = buildingEntries.filter(
e => !e.root.userData.realAsset
).length;

status.textContent =
`Loaded ${roadModels.length} road pieces and ${buildingEntries.length} buildings.
Spawn store: CornerShop.
Car park: added.
Missing building assets: ${missing}.
Compact layout loaded.`;


// RESIZE

window.addEventListener('resize', () => {

camera.aspect = innerWidth / innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});


// RENDER LOOP

function animate() {

requestAnimationFrame(animate);

controls.update();

renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
