<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City Test</title>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
}
}
</script>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #a9c4d8;
font-family: Arial, sans-serif;
}
#info {
position: absolute;
top: 15px;
left: 15px;
padding: 12px 16px;
color: white;
background: #17212ddd;
border-radius: 8px;
z-index: 2;
}
</style>
</head>

<body>
<div id="info">Loading city...</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c4d8);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth / window.innerHeight,
0.1,
2000
);

const renderer = new THREE.WebGLRenderer({
antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x687080, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2.5);
sunlight.position.set(100, 150, 80);
sunlight.castShadow = true;
scene.add(sunlight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

const loader = new GLTFLoader();

loader.load(
'./hero-high-street-1.glb',
(gltf) => {
const city = gltf.scene;
scene.add(city);

city.traverse((object) => {
if (object.isMesh) {
object.castShadow = true;
object.receiveShadow = true;
}
});

const box = new THREE.Box3().setFromObject(city);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const largest = Math.max(size.x, size.y, size.z);

controls.target.copy(center);

camera.position.set(
center.x + largest * 0.8,
center.y + largest * 0.55,
center.z + largest * 0.8
);

camera.near = Math.max(0.1, largest / 1000);
camera.far = largest * 20;
camera.updateProjectionMatrix();

controls.minDistance = largest * 0.08;
controls.maxDistance = largest * 3;
controls.update();

document.getElementById('info').textContent =
'City loaded! Drag to rotate • Scroll to zoom';
},
(progress) => {
if (progress.total) {
const percent = Math.round(
progress.loaded / progress.total * 100
);
document.getElementById('info').textContent =
'Loading city: ' + percent + '%';
}
},
(error) => {
console.error(error);
document.getElementById('info').textContent =
'Could not load city. Check the browser console.';
}
);

function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
