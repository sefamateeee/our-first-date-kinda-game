<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Our First Date kinda game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial;background:#9bd8ee}
canvas{display:block;touch-action:none}
#start{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#203e3688;color:white;text-align:center}
.panel{background:#203e36ee;padding:30px;border-radius:22px;max-width:330px}
.panel h1{margin-bottom:12px}
.panel p{line-height:1.6}
#instructions{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:2;background:#203e36bb;color:white;padding:10px 15px;border-radius:12px;text-align:center;font-size:12px;pointer-events:none;line-height:1.5}
#status{position:absolute;top:14px;right:14px;z-index:3;background:#203e36dd;color:white;padding:9px 12px;border-radius:12px;font-size:12px;pointer-events:none}
#joystick{display:none;position:absolute;bottom:28px;left:25px;width:140px;height:140px;border-radius:50%;background:#203e3655;border:2px solid #ffffff99;z-index:5;touch-action:none}
#stick{position:absolute;width:58px;height:58px;left:39px;top:39px;border-radius:50%;background:#ffffffbb;border:3px solid white;pointer-events:none}
#runButton{display:none;position:absolute;right:28px;bottom:35px;width:76px;height:76px;border-radius:50%;border:2px solid #ffffffaa;background:#203e36bb;color:white;font-weight:bold;font-size:15px;z-index:5;touch-action:none}
@media(pointer:coarse){#joystick,#runButton{display:block}#instructions{font-size:11px}}
</style>
</head>
<body>

<div id="start">
<div class="panel">
<h1>Our First Date kinda game</h1>
<p>Welcome to our little world.</p>
<p style="margin-top:12px">Tap to explore the city</p>
<p style="font-size:12px;margin-top:15px">WASD – Move · Shift – Run<br>Mouse or finger – Look around</p>
</div>
</div>

<div id="instructions">WASD – Move | SHIFT – Run<br>Mouse / Finger – Look around</div>
<div id="status">Connecting to multiplayer...</div>
<div id="joystick"><div id="stick"></div></div>
<button id="runButton">RUN</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import {getAuth,signInAnonymously} from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
import {getDatabase,ref,set,onValue,onDisconnect} from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js';

// FIREBASE
const firebaseConfig={
apiKey:"AIzaSyCIkwXfeAfEZrG1kE0myW8BIRXNq5gOnpE",
authDomain:"our-first-date-kinda-game.firebaseapp.com",
databaseURL:"https://our-first-date-kinda-game-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"our-first-date-kinda-game",
storageBucket:"our-first-date-kinda-game.firebasestorage.app",
messagingSenderId:"176526649038",
appId:"1:176526649038:web:3c6ab02491491e4e8e129f",
measurementId:"G-49HR8VS7TV"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const statusText=document.getElementById('status');

let myUID=null;
let myPlayerRef=null;
let networkReady=false;
const remotePlayers=new Map();

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd8ee);
scene.fog=new THREE.Fog(0x9bd8ee,65,190);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x64804c,2));
const sun=new THREE.DirectionalLight(0xfff2d5,2.3);
sun.position.set(-25,40,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

function material(color){
return new THREE.MeshStandardMaterial({color,roughness:1});
}

// GROUND
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),material(0x78ae60));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ROAD
const road=new THREE.Mesh(new THREE.PlaneGeometry(13,400),material(0x41474b));
road.rotation.x=-Math.PI/2;
road.position.y=.035;
scene.add(road);

for(const x of [-7.2,7.2]){
const edge=new THREE.Mesh(new THREE.BoxGeometry(.25,.12,400),material(0xe4dfc9));
edge.position.set(x,.08,0);
scene.add(edge);
}

for(let z=-190;z<200;z+=9){
const line=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,4),material(0xf5e7a6));
line.position.set(0,.105,z);
scene.add(line);
}

// PAVEMENTS
for(const x of [-9,9]){
const pavement=new THREE.Mesh(new THREE.BoxGeometry(3,.25,400),material(0xbab9a9));
pavement.position.set(x,.12,0);
scene.add(pavement);
}

// BUILDINGS
const buildingColors=[0xd6b99b,0xc4a6a0,0xd8d0b5,0xa9c5c6,0xd6d1c4,0xb9ad99,0xe0c5a2,0x9db3a6];

function createBuilding(x,z,w,d,h,color){
const group=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
body.position.y=h/2+.25;
body.castShadow=true;
body.receiveShadow=true;
group.add(body);

const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.35,.35,d+.35),material(0x56504b));
roof.position.y=h+.4;
group.add(roof);

const side=x<0?1:-1;
const columns=Math.max(2,Math.floor(d/2.4));
const rows=Math.max(2,Math.floor(h/2.4));

for(let row=0;row<rows;row++){
for(let col=0;col<columns;col++){
const win=new THREE.Mesh(new THREE.BoxGeometry(.09,1.05,.85),material(Math.random()>.25?0x82c5d9:0xffe3a0));
win.position.set(side*(w/2+.05),1.35+row*2.15,-d/2+1.2+col*(d-1.5)/Math.max(1,columns-1));
group.add(win);
}
}

const door=new THREE.Mesh(new THREE.BoxGeometry(.12,2,.95),material(0x594332));
door.position.set(side*(w/2+.08),1.25,0);
group.add(door);

const sign=new THREE.Mesh(new THREE.BoxGeometry(.16,.55,2.4),material(0x397c72));
sign.position.set(side*(w/2+.12),h*.65,0);
group.add(sign);

group.position.set(x,0,z);
scene.add(group);
}

for(let z=-90;z<=100;z+=19){
createBuilding(-14,z,9,12,9+Math.random()*12,buildingColors[Math.floor(Math.random()*buildingColors.length)]);
createBuilding(14,z,9,12,9+Math.random()*16,buildingColors[Math.floor(Math.random()*buildingColors.length)]);
}

// STREETLIGHTS
function createStreetLight(x,z){
const group=new THREE.Group();
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,5,8),material(0x333b3d));
pole.position.y=2.5;
group.add(pole);

const arm=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,1.1),material(0x333b3d));
arm.position.set(0,4.8,x<0?-.35:.35);
group.add(arm);

const lamp=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),material(0xffe8a3));
lamp.position.set(0,4.7,x<0?-.8:.8);
group.add(lamp);
group.position.set(x,0,z);
scene.add(group);
}

for(let z=-90;z<110;z+=17){
createStreetLight(-7.9,z);
createStreetLight(7.9,z);
}

// TREES
function createTree(x,z,scale=1){
const group=new THREE.Group();
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.32,2.5,8),material(0x80502f));
trunk.position.y=1.25;
group.add(trunk);

for(let i=0;i<3;i++){
const leaves=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25-i*.13,1),material([0x397f43,0x4d994c,0x67a94f][i]));
leaves.position.set((i-1)*.25,2.8+(i===1?.4:0),0);
group.add(leaves);
}

group.position.set(x,0,z);
group.scale.setScalar(scale);
scene.add(group);
}

for(let z=-100;z<110;z+=13){
createTree(-10.7,z,.8);
createTree(10.7,z,.8);
}

// CHARACTER MATERIALS
const skin=material(0xd99b72);
const tunic=material(0x398b72);
const tunicLight=material(0x65b68c);
const trousers=material(0x394b68);
const boots=material(0x63452e);
const hair=material(0x352319);
const dark=material(0x30251f);
const white=material(0xffffff);

function part(parent,geo,mat,x,y,z){
const mesh=new THREE.Mesh(geo,mat);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
parent.add(mesh);
return mesh;
}

// CREATE A FRESH CHARACTER WITH ITS OWN ANIMATION JOINTS
function createCharacter(){
const group=new THREE.Group();

const torso=part(group,new THREE.CapsuleGeometry(.37,.65,5,10),tunic,0,1.45,0);
torso.scale.set(1,.95,.75);

part(group,new THREE.TorusGeometry(.19,.055,8,16),tunicLight,0,1.85,0);

const head=new THREE.Group();
head.position.set(0,2.35,0);
group.add(head);

part(head,new THREE.SphereGeometry(.34,20,16),skin,0,0,0);
part(head,new THREE.SphereGeometry(.355,16,12,0,Math.PI*2,0,Math.PI/2),hair,0,.08,0);
part(head,new THREE.SphereGeometry(.31,12,12),hair,0,-.08,-.16).scale.set(1,.9,.65);

for(const x of [-.12,.12]){
part(head,new THREE.SphereGeometry(.045,10,10),white,x,-.015,.295);
part(head,new THREE.SphereGeometry(.022,8,8),dark,x,-.02,.33);
}
part(head,new THREE.SphereGeometry(.045,8,8),skin,0,-.1,.33);

function createArm(x){
const pivot=new THREE.Group();
pivot.position.set(x,1.78,0);
group.add(pivot);
part(pivot,new THREE.CapsuleGeometry(.12,.52,4,8),tunic,0,-.34,0);
part(pivot,new THREE.SphereGeometry(.12,10,10),skin,0,-.68,.015);
return pivot;
}

function createLeg(x){
const pivot=new THREE.Group();
pivot.position.set(x,.85,0);
group.add(pivot);
part(pivot,new THREE.CapsuleGeometry(.16,.48,4,8),trousers,0,-.27,0);
part(pivot,new THREE.BoxGeometry(.3,.2,.48),boots,0,-.61,.1);
return pivot;
}

const leftArm=createArm(-.48);
const rightArm=createArm(.48);
const leftLeg=createLeg(-.2);
const rightLeg=createLeg(.2);

part(group,new THREE.TorusGeometry(.3,.055,8,16),material(0x704b2c),0,1.12,0).rotation.x=Math.PI/2;

return {group,torso,leftArm,rightArm,leftLeg,rightLeg};
}

// LOCAL PLAYER
const character=createCharacter();
const player=character.group;
scene.add(player);
player.position.set(0,0,5);

// INPUT
const keys={};
let yaw=0;
let pitch=.12;
let running=false;
let localMoving=false;
let localSprinting=false;
let walkPhase=0;

window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',()=>{
for(const key in keys)keys[key]=false;
running=false;
});

document.getElementById('start').addEventListener('click',()=>{
document.getElementById('start').style.display='none';
if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock();
});

// RUN BUTTON
const runButton=document.getElementById('runButton');
runButton.addEventListener('pointerdown',e=>{
e.preventDefault();
running=true;
});
for(const eventName of ['pointerup','pointerleave','pointercancel']){
runButton.addEventListener(eventName,()=>running=false);
}

// JOYSTICK
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joystickPointer=null;
let joyX=0;
let joyY=0;

function resetJoystick(){
joyX=0;
joyY=0;
joystickPointer=null;
stick.style.transform='translate(0px,0px)';
}

function updateJoystick(e){
const rect=joystick.getBoundingClientRect();
const centerX=rect.left+rect.width/2;
const centerY=rect.top+rect.height/2;
let dx=e.clientX-centerX;
let dy=e.clientY-centerY;
const maxDistance=48;
const distance=Math.hypot(dx,dy);

if(distance>maxDistance){
dx=dx/distance*maxDistance;
dy=dy/distance*maxDistance;
}

joyX=dx/maxDistance;
joyY=dy/maxDistance;
stick.style.transform=`translate(${dx}px,${dy}px)`;
}

joystick.addEventListener('pointerdown',e=>{
e.preventDefault();
if(joystickPointer!==null)return;
joystickPointer=e.pointerId;
joystick.setPointerCapture(e.pointerId);
updateJoystick(e);
});

joystick.addEventListener('pointermove',e=>{
if(e.pointerId!==joystickPointer)return;
e.preventDefault();
updateJoystick(e);
});

joystick.addEventListener('pointerup',e=>{
if(e.pointerId===joystickPointer)resetJoystick();
});
joystick.addEventListener('pointercancel',resetJoystick);
joystick.addEventListener('lostpointercapture',resetJoystick);

// PC CAMERA
document.addEventListener('mousemove',e=>{
if(document.pointerLockElement!==renderer.domElement)return;
yaw-=e.movementX*.003;
pitch+=e.movementY*.002;
pitch=THREE.MathUtils.clamp(pitch,-.65,.65);
});

// IPAD CAMERA
let cameraPointer=null;
let touchX=0;
let touchY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
if(e.pointerType!=='touch')return;
if(e.clientX<innerWidth*.42)return;
cameraPointer=e.pointerId;
renderer.domElement.setPointerCapture(e.pointerId);
touchX=e.clientX;
touchY=e.clientY;
});

renderer.domElement.addEventListener('pointermove',e=>{
if(e.pointerId!==cameraPointer)return;
const dx=e.clientX-touchX;
const dy=e.clientY-touchY;
yaw-=dx*.006;
pitch+=dy*.004;
pitch=THREE.MathUtils.clamp(pitch,-.65,.65);
touchX=e.clientX;
touchY=e.clientY;
});

function releaseCamera(e){
if(e.pointerId===cameraPointer)cameraPointer=null;
}
renderer.domElement.addEventListener('pointerup',releaseCamera);
renderer.domElement.addEventListener('pointercancel',releaseCamera);
renderer.domElement.addEventListener('lostpointercapture',releaseCamera);

// MULTIPLAYER
async function connectMultiplayer(){
try{
const result=await signInAnonymously(auth);
myUID=result.user.uid;
myPlayerRef=ref(db,'players/'+myUID);

await onDisconnect(myPlayerRef).remove();

await set(myPlayerRef,{
x:player.position.x,
z:player.position.z,
yaw:yaw,
moving:false,
running:false,
phase:0,
updatedAt:Date.now()
});

networkReady=true;

onValue(ref(db,'players'),snapshot=>{
snapshot.forEach(child=>{
const id=child.key;
const data=child.val();

if(id===myUID||!data)return;

let other=remotePlayers.get(id);

if(!other){
other=createCharacter();
other.group.position.set(Number(data.x)||0,0,Number(data.z)||0);
other.group.userData.targetPosition=new THREE.Vector3(Number(data.x)||0,0,Number(data.z)||0);
other.group.userData.targetYaw=Number(data.yaw)||0;
other.group.userData.targetMoving=data.moving===true;
other.group.userData.targetRunning=data.running===true;
other.group.userData.targetPhase=Number(data.phase)||0;
other.group.userData.currentPhase=Number(data.phase)||0;
other.group.userData.currentBounce=0;
scene.add(other.group);
remotePlayers.set(id,other);
}

const dataTarget=other.group.userData;
dataTarget.targetPosition.set(Number(data.x)||0,0,Number(data.z)||0);
dataTarget.targetYaw=Number(data.yaw)||0;
dataTarget.targetMoving=data.moving===true;
dataTarget.targetRunning=data.running===true;
dataTarget.targetPhase=Number(data.phase)||0;
});

for(const [id,other] of remotePlayers){
if(!snapshot.hasChild(id)){
scene.remove(other.group);
remotePlayers.delete(id);
}
}

statusText.textContent=remotePlayers.size>0
?'🟢 Multiplayer · '+(remotePlayers.size+1)+' players'
:'🟢 Connected · Waiting for Tina';
},error=>{
console.error('Multiplayer read error:',error);
statusText.textContent='🔴 Multiplayer read error';
});

}catch(error){
console.error('Firebase connection error:',error);
statusText.textContent='🔴 Connection failed';
}
}

connectMultiplayer();

// SEND POSITION, FACING AND ANIMATION
let lastSent=0;

function sendMyPosition(){
if(!networkReady||!myPlayerRef)return;

set(myPlayerRef,{
x:player.position.x,
z:player.position.z,
yaw:yaw,
moving:localMoving,
running:localSprinting,
phase:walkPhase,
updatedAt:Date.now()
}).catch(error=>{
console.error('Position update failed:',error);
});
}

// GAME LOOP
const clock=new THREE.Clock();
const targetCamera=new THREE.Vector3();

function animate(){
requestAnimationFrame(animate);

const delta=Math.min(clock.getDelta(),.05);
const time=clock.elapsedTime;

let forward=0;
let sideways=0;

if(keys.w||keys.arrowup)forward+=1;
if(keys.s||keys.arrowdown)forward-=1;
if(keys.d||keys.arrowright)sideways+=1;
if(keys.a||keys.arrowleft)sideways-=1;

forward+=-joyY;
sideways+=joyX;

const length=Math.hypot(forward,sideways);
const moving=length>.08;
const sprint=keys.shift||running;

localMoving=moving;
localSprinting=moving&&sprint;

if(moving){
forward/=length;
sideways/=length;

const dx=-Math.sin(yaw)*forward+Math.cos(yaw)*sideways;
const dz=-Math.cos(yaw)*forward-Math.sin(yaw)*sideways;
const speed=sprint?10:5.5;

player.position.x+=dx*speed*delta;
player.position.z+=dz*speed*delta;
walkPhase+=delta*(sprint?13:9);
}

// SAME FACING RULE FOR BOTH DEVICES
player.rotation.y=Math.PI+yaw;

const swing=moving?Math.sin(walkPhase)*.65:0;
character.leftLeg.rotation.x=swing;
character.rightLeg.rotation.x=-swing;
character.leftArm.rotation.x=-swing*.8;
character.rightArm.rotation.x=swing*.8;

character.torso.scale.y=.95+Math.sin(time*2)*.012;

player.position.y=moving
?Math.abs(Math.sin(walkPhase*2))*.045
:Math.sin(time*2)*.015;

// REMOTE CHARACTERS
for(const other of remotePlayers.values()){
const data=other.group.userData;

// Smooth position updates
other.group.position.lerp(data.targetPosition,Math.min(1,delta*10));

// Match the exact same facing direction as the other device
const targetRotation=Math.PI+data.targetYaw;
const rotationDifference=Math.atan2(
Math.sin(targetRotation-other.group.rotation.y),
Math.cos(targetRotation-other.group.rotation.y)
);
other.group.rotation.y+=rotationDifference*Math.min(1,delta*12);

// Smoothly follow the animation phase sent by the other player
if(data.targetMoving){
let phaseDifference=data.targetPhase-data.currentPhase;
while(phaseDifference>Math.PI)phaseDifference-=Math.PI*2;
while(phaseDifference< -Math.PI)phaseDifference+=Math.PI*2;
data.currentPhase+=phaseDifference*Math.min(1,delta*12);
}

const remoteSwing=data.targetMoving
?Math.sin(data.currentPhase)*.65
:0;

other.leftLeg.rotation.x=remoteSwing;
other.rightLeg.rotation.x=-remoteSwing;
other.leftArm.rotation.x=-remoteSwing*.8;
other.rightArm.rotation.x=remoteSwing*.8;

other.torso.scale.y=.95+Math.sin(time*2)*.012;

const bounce=data.targetMoving
?Math.abs(Math.sin(data.currentPhase*2))*.045
:Math.sin(time*2)*.015;

other.group.position.y=THREE.MathUtils.lerp(
other.group.position.y,bounce,Math.min(1,delta*10)
);
}

// CAMERA
const horizontal=7*Math.cos(pitch);

targetCamera.set(
player.position.x+Math.sin(yaw)*horizontal,
player.position.y+2.2+7*Math.sin(pitch),
player.position.z+Math.cos(yaw)*horizontal
);

camera.position.lerp(targetCamera,.16);
camera.lookAt(player.position.x,player.position.y+1.45,player.position.z);

// SEND UPDATES
if(time-lastSent>.1){
sendMyPosition();
lastSent=time;
}

renderer.render(scene,camera);
}

animate();

// RESIZE
window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
