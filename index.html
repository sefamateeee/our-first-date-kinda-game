<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our First Date Kinda Game </title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { overflow:hidden; font-family:Arial,sans-serif; background:#9bd8ee; }
canvas { display:block; touch-action:none; }

#start {
position:absolute; inset:0; z-index:10;
display:flex; align-items:center; justify-content:center;
background:linear-gradient(rgba(20,45,40,.25),rgba(20,45,40,.65));
color:white; text-align:center; cursor:pointer;
}
.panel {
background:rgba(25,45,42,.88); padding:30px;
border:2px solid rgba(255,255,255,.5);
border-radius:22px; max-width:340px;
box-shadow:0 10px 35px #0005;
}
.panel h1 { font-size:27px; margin-bottom:12px; }
.panel p { line-height:1.6; }
#instructions {
position:absolute; top:15px; left:50%;
transform:translateX(-50%); z-index:2;
background:#203e36bb; color:white;
padding:10px 16px; border-radius:12px;
text-align:center; font-size:13px;
pointer-events:none; line-height:1.5;
}
#touchControls {
display:none; position:absolute; bottom:25px; left:20px;
z-index:4; grid-template-columns:repeat(3,56px);
grid-template-rows:repeat(2,56px); gap:5px;
}
.moveButton {
width:56px; height:56px; border:1px solid #ffffff77;
border-radius:15px; background:#203e36aa;
color:white; font-size:23px; touch-action:none;
}
#runButton {
position:absolute; right:24px; bottom:35px;
display:none; z-index:4; width:72px; height:72px;
border:1px solid #ffffff77; border-radius:50%;
background:#203e36aa; color:white;
font-weight:bold; touch-action:none;
}
@media (pointer:coarse) {
#touchControls { display:grid; }
#runButton { display:block; }
#instructions { font-size:11px; }
}
</style>
</head>
<body>

<div id="start">
<div class="panel">
<h1>Our First Date kinda game</h1>
<p>Welcome to our little world.</p>
<p style="margin-top:12px">Tap to explore together</p>
<p style="font-size:12px;margin-top:15px">
WASD to move · Shift to run<br>
Move your mouse or finger to look around
</p>
</div>
</div>

<div id="instructions">
WASD – Move &nbsp; | &nbsp; SHIFT – Run<br>
Mouse / Finger – Look around
</div>

<div id="touchControls">
<button class="moveButton" data-key="w" style="grid-column:2;grid-row:1">↑</button>
<button class="moveButton" data-key="a" style="grid-column:1;grid-row:2">←</button>
<button class="moveButton" data-key="s" style="grid-column:2;grid-row:2">↓</button>
<button class="moveButton" data-key="d" style="grid-column:3;grid-row:2">→</button>
</div>
<button id="runButton">RUN</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd8ee);
scene.fog = new THREE.Fog(0x9bd8ee, 35, 110);

// CAMERA
const camera = new THREE.PerspectiveCamera(
65, window.innerWidth/window.innerHeight, 0.1, 300
);

// RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x64804c,2));

const sun = new THREE.DirectionalLight(0xfff2d5,2.4);
sun.position.set(-20,35,15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

// MATERIAL HELPER
function mat(color, roughness=1) {
return new THREE.MeshStandardMaterial({color,roughness});
}

// GROUND
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(300,300),
mat(0x75b95a)
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// PATH
const path = new THREE.Mesh(
new THREE.PlaneGeometry(7,250),
mat(0xc9ad7d)
);
path.rotation.x=-Math.PI/2;
path.position.y=.025;
scene.add(path);

// GRASS PATCHES
for(let i=0;i<160;i++){
const x=(Math.random()-.5)*100;
const z=(Math.random()-.5)*130;
if(Math.abs(x)<5) continue;
const tuft=new THREE.Group();
for(let j=0;j<3;j++){
const blade=new THREE.Mesh(
new THREE.ConeGeometry(.09,.65,5),
mat([0x45964c,0x5ba94c,0x80bc53][j])
);
blade.position.set((j-1)*.12,.28,0);
blade.rotation.z=(j-1)*.35;
tuft.add(blade);
}
tuft.position.set(x,0,z);
scene.add(tuft);
}

// TREES
function createTree(x,z,scale=1){
const tree=new THREE.Group();
const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.25,.38,2.8,9),
mat(0x80502f)
);
trunk.position.y=1.4;
trunk.castShadow=true;
tree.add(trunk);

const colors=[0x397f43,0x4d994c,0x67a94f];
for(let i=0;i<3;i++){
const leaves=new THREE.Mesh(
new THREE.IcosahedronGeometry(1.45-i*.16,1),
mat(colors[i])
);
leaves.position.set(
(i-1)*.35,3.15+(i===1?.55:0),0
);
leaves.scale.set(1.05,1.05,1);
leaves.castShadow=true;
tree.add(leaves);
}
tree.position.set(x,0,z);
tree.scale.setScalar(scale);
scene.add(tree);
}

for(let i=-12;i<=12;i++){
createTree(-11+(Math.random()-.5)*3,i*6,.8+Math.random()*.5);
createTree(11+(Math.random()-.5)*3,i*6,.8+Math.random()*.5);
}
for(let i=0;i<22;i++){
const x=(Math.random()-.5)*75;
const z=-35-Math.random()*75;
if(Math.abs(x)>7) createTree(x,z,.7+Math.random()*.7);
}

// ROCKS
for(let i=0;i<45;i++){
const rock=new THREE.Mesh(
new THREE.DodecahedronGeometry(.4+Math.random()*.6,0),
mat(0x858b80)
);
rock.position.set(
(Math.random()-.5)*45,
.3,
(Math.random()-.5)*100
);
rock.scale.y=.65;
rock.rotation.set(Math.random(),Math.random(),Math.random());
rock.castShadow=true;
scene.add(rock);
}

// FLOWERS
const flowerColors=[0xffe5a3,0xff9baf,0xffffff,0xbba5ed];
for(let i=0;i<120;i++){
const flower=new THREE.Group();
const stem=new THREE.Mesh(
new THREE.CylinderGeometry(.025,.035,.35,5),
mat(0x397b3d)
);
stem.position.y=.17;
flower.add(stem);

const center=new THREE.Mesh(
new THREE.SphereGeometry(.08,8,8),
mat(0xffd35c)
);
center.position.y=.39;
flower.add(center);

for(let j=0;j<5;j++){
const petal=new THREE.Mesh(
new THREE.SphereGeometry(.09,8,8),
mat(flowerColors[i%flowerColors.length])
);
const a=j*Math.PI*2/5;
petal.position.set(Math.cos(a)*.12,.4,Math.sin(a)*.12);
flower.add(petal);
}
flower.position.set(
(Math.random()-.5)*20,
0,
(Math.random()-.5)*100
);
if(Math.abs(flower.position.x)>4.5) scene.add(flower);
}

// CHARACTER
const player=new THREE.Group();
scene.add(player);

const skin=mat(0xd99b72);
const tunic=mat(0x398b72);
const tunicLight=mat(0x65b68c);
const trousers=mat(0x394b68);
const boots=mat(0x63452e);
const hairMat=mat(0x352319);
const dark=mat(0x30251f);
const white=mat(0xffffff);

// CHARACTER PART HELPER
function part(parent,geometry,material,x,y,z){
const mesh=new THREE.Mesh(geometry,material);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
parent.add(mesh);
return mesh;
}

// BODY
const torso=part(
player,new THREE.CapsuleGeometry(.37,.65,5,10),
tunic,0,1.45,0
);
torso.scale.set(1,.95,.75);

// TUNIC COLLAR
part(player,new THREE.TorusGeometry(.19,.055,8,16),tunicLight,0,1.85,0);

// HEAD
const headGroup=new THREE.Group();
headGroup.position.set(0,2.35,0);
player.add(headGroup);

part(headGroup,new THREE.SphereGeometry(.34,20,16),skin,0,0,0);

// HAIR CAP
const cap=part(
headGroup,new THREE.SphereGeometry(.355,16,12,0,Math.PI*2,0,Math.PI/2),
hairMat,0,.08,0
);
cap.scale.set(1.05,1,1.05);

// HAIR BACK
part(headGroup,new THREE.SphereGeometry(.31,12,12),hairMat,0,-.08,-.16).scale.set(1,.9,.65);

// EYES
for(const x of [-.12,.12]){
const eye=part(headGroup,new THREE.SphereGeometry(.045,10,10),white,x,-.015,.295);
const pupil=part(headGroup,new THREE.SphereGeometry(.022,8,8),dark,x,-.02,.33);
}

// NOSE
part(headGroup,new THREE.SphereGeometry(.045,8,8),skin,0,-.1,.33);

// ARMS WITH PIVOTS
function createArm(x){
const pivot=new THREE.Group();
pivot.position.set(x,1.78,0);
player.add(pivot);

part(pivot,new THREE.CapsuleGeometry(.12,.52,4,8),tunic,0,-.34,0);
part(pivot,new THREE.SphereGeometry(.12,10,10),skin,0,-.68,.015);
return pivot;
}
const leftArm=createArm(-.48);
const rightArm=createArm(.48);

// LEGS WITH PIVOTS
function createLeg(x){
const pivot=new THREE.Group();
pivot.position.set(x,.85,0);
player.add(pivot);

part(pivot,new THREE.CapsuleGeometry(.16,.48,4,8),trousers,0,-.27,0);
part(pivot,new THREE.BoxGeometry(.3,.2,.48),boots,0,-.61,.1);
return pivot;
}
const leftLeg=createLeg(-.2);
const rightLeg=createLeg(.2);

// BELT
part(player,new THREE.TorusGeometry(.3,.055,8,16),mat(0x704b2c),0,1.12,0).rotation.x=Math.PI/2;

// PLAYER START
player.position.set(0,0,5);

// CONTROLS
const keys={};
let yaw=0;
let pitch=.12;
const distance=7;
let running=false;

window.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
});
window.addEventListener('keyup',e=>{
keys[e.key.toLowerCase()]=false;
});

// MOUSE LOOK
document.addEventListener('mousemove',e=>{
if(document.pointerLockElement!==renderer.domElement) return;

// Horizontal mouse movement
yaw-=e.movementX*.003;

// Vertical mouse movement: move up to look up
pitch+=e.movementY*.002;
pitch=THREE.MathUtils.clamp(pitch,-.65,.65);
});

// START
document.getElementById('start').addEventListener('click',()=>{
document.getElementById('start').style.display='none';
if(window.matchMedia('(pointer:fine)').matches){
renderer.domElement.requestPointerLock();
}
});

// TOUCH BUTTONS
document.querySelectorAll('.moveButton').forEach(button=>{
const key=button.dataset.key;
button.addEventListener('pointerdown',e=>{
e.preventDefault();
keys[key]=true;
});
for(const eventName of ['pointerup','pointerleave','pointercancel']){
button.addEventListener(eventName,()=>keys[key]=false);
}
});

// RUN BUTTON
const runButton=document.getElementById('runButton');
runButton.addEventListener('pointerdown',e=>{
e.preventDefault();
running=true;
});
for(const name of ['pointerup','pointerleave','pointercancel']){
runButton.addEventListener(name,()=>running=false);
}

// TOUCH CAMERA
let touchX=0,touchY=0,looking=false;

renderer.domElement.addEventListener('pointerdown',e=>{
if(e.pointerType!=='touch') return;
looking=true;
touchX=e.clientX;
touchY=e.clientY;
});

renderer.domElement.addEventListener('pointermove',e=>{
if(!looking || e.pointerType!=='touch') return;

const dx=e.clientX-touchX;
const dy=e.clientY-touchY;

yaw-=dx*.006;
pitch+=dy*.004;
pitch=THREE.MathUtils.clamp(pitch,-.65,.65);

touchX=e.clientX;
touchY=e.clientY;
});

renderer.domElement.addEventListener('pointerup',()=>looking=false);
renderer.domElement.addEventListener('pointercancel',()=>looking=false);

// ANIMATION
const clock=new THREE.Clock();
const targetCamera=new THREE.Vector3();

function animate(){
requestAnimationFrame(animate);

const time=clock.getElapsedTime();
const delta=Math.min(clock.getDelta(),.05);

let forward=0;
let sideways=0;

if(keys.w || keys.arrowup) forward+=1;
if(keys.s || keys.arrowdown) forward-=1;
if(keys.d || keys.arrowright) sideways+=1;
if(keys.a || keys.arrowleft) sideways-=1;

const moving=forward!==0 || sideways!==0;
const isRunning=keys.shift || running;
const speed=isRunning?.19:.105;

if(moving){
const length=Math.hypot(forward,sideways);
forward/=length;
sideways/=length;

// Camera-relative movement
const dx=Math.sin(yaw)*forward+Math.cos(yaw)*sideways;
const dz=-Math.cos(yaw)*forward+Math.sin(yaw)*sideways;

player.position.x+=dx*speed*(delta*60);
player.position.z+=dz*speed*(delta*60);
}

// Character faces the direction the camera is looking
const facing= Math.PI-yaw;
player.rotation.y=facing;

// WALK AND RUN ANIMATIONS
const animSpeed=isRunning?13:9;
const swing=moving?Math.sin(time*animSpeed)*.65:0;
const amount=moving?1:0;

leftLeg.rotation.x=swing*amount;
rightLeg.rotation.x=-swing*amount;
leftArm.rotation.x=-swing*amount*.8;
rightArm.rotation.x=swing*amount*.8;

// Gentle idle breathing
torso.scale.y=.95+Math.sin(time*2)*.012;
player.position.y=moving
? Math.abs(Math.sin(time*animSpeed*2))*.055
: Math.sin(time*2)*.015;

// CAMERA FOLLOW
const horizontal=distance*Math.cos(pitch);

targetCamera.set(
player.position.x+Math.sin(yaw)*horizontal,
player.position.y+2.2+distance*Math.sin(pitch),
player.position.z+Math.cos(yaw)*horizontal
);

camera.position.lerp(targetCamera,.14);
camera.lookAt(
player.position.x,
player.position.y+1.45,
player.position.z
);

renderer.render(scene,camera);
}

animate();

// RESIZE
window.addEventListener('resize',()=>{
camera.aspect=window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
