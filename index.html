<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>our first date kinda game</title>
<style>
* { box-sizing: border-box; }
body {
margin: 0;
overflow: hidden;
font-family: Arial, sans-serif;
}
#info {
position: fixed;
top: 15px;
left: 15px;
z-index: 2;
color: white;
background: #0009;
padding: 12px 18px;
border-radius: 12px;
}
</style>
</head>
<body>

<div id="info">our first date kinda game</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
75, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x557755, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10, 20, 10);
scene.add(sun);

// Grass
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(200, 200),
new THREE.MeshStandardMaterial({ color: 0x55aa55 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Path
const path = new THREE.Mesh(
new THREE.BoxGeometry(5, 0.08, 60),
new THREE.MeshStandardMaterial({ color: 0xc2ad8c })
);
path.position.set(0, 0.04, -10);
scene.add(path);

// Player
const player = new THREE.Group();

const body = new THREE.Mesh(
new THREE.BoxGeometry(0.8, 1.2, 0.5),
new THREE.MeshStandardMaterial({ color: 0xff6699 })
);
body.position.y = 1.2;
player.add(body);

const head = new THREE.Mesh(
new THREE.SphereGeometry(0.38, 24, 24),
new THREE.MeshStandardMaterial({ color: 0xffd1b0 })
);
head.position.y = 2;
player.add(head);

scene.add(player);

// Trees
for (let i = 0; i < 25; i++) {
const tree = new THREE.Group();

const trunk = new THREE.Mesh(
new THREE.CylinderGeometry(0.2, 0.3, 2),
new THREE.MeshStandardMaterial({ color: 0x79502d })
);
trunk.position.y = 1;
tree.add(trunk);

const leaves = new THREE.Mesh(
new THREE.SphereGeometry(1.2, 12, 12),
new THREE.MeshStandardMaterial({ color: 0x237a37 })
);
leaves.position.y = 2.5;
tree.add(leaves);

tree.position.set(
(Math.random() - 0.5) * 70,
0,
(Math.random() - 0.5) * 70
);
scene.add(tree);
}

// Camera
camera.position.set(0, 5, 8);

const keys = {};

window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

function animate() {
requestAnimationFrame(animate);

const speed = 0.12;

if (keys['w']) player.position.z -= speed;
if (keys['s']) player.position.z += speed;
if (keys['a']) player.position.x -= speed;
if (keys['d']) player.position.x += speed;

camera.position.x += (player.position.x - camera.position.x) * 0.08;
camera.position.z += (player.position.z + 8 - camera.position.z) * 0.08;
camera.position.y += (5 - camera.position.y) * 0.08;
camera.lookAt(player.position.x, 1, player.position.z);

renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
