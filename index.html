<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Our First Date Kinda Game ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:Arial;background:#9bd8ee}
canvas{display:block;touch-action:none}

#start{
position:absolute;inset:0;z-index:10;
display:flex;align-items:center;justify-content:center;
background:#203e3677;color:white;text-align:center;
overflow-y:auto;padding:15px
}
.panel{
background:#203e36ee;padding:22px;border-radius:22px;
width:min(440px,100%);max-height:95vh;overflow-y:auto;
text-align:left
}
.panel h1{text-align:center;margin-bottom:8px;font-size:25px}
.subtitle{text-align:center;font-size:13px;opacity:.85;margin-bottom:17px}
.section-title{font-weight:bold;margin:15px 0 7px;color:#c6e8d4}
.field{margin:9px 0}
.field label{display:block;font-size:12px;margin-bottom:5px;color:#e2f1e7}
.field select{
width:100%;padding:11px;border:0;border-radius:9px;
background:#f4f4ee;color:#243a31;font-size:14px
}
.field select:focus{outline:2px solid #8bd0a8}
#enterButton{
width:100%;padding:14px;margin-top:17px;border:0;
border-radius:12px;background:#8bd0a8;color:#183b2c;
font-size:16px;font-weight:bold
}
#enterButton:active{transform:scale(.98)}
#instructions{
position:absolute;top:14px;left:50%;transform:translateX(-50%);
z-index:2;background:#203e36bb;color:white;padding:10px 15px;
border-radius:12px;text-align:center;font-size:12px;
pointer-events:none;line-height:1.5
}
#status{
position:absolute;top:14px;right:14px;z-index:3;
background:#203e36dd;color:white;padding:9px 12px;
border-radius:12px;font-size:12px;pointer-events:none
}
#wardrobe{
display:none;position:absolute;top:65px;right:14px;z-index:4;
background:#203e36dd;color:white;border:1px solid #ffffff77;
border-radius:12px;padding:12px 16px;font-weight:bold
}
#joystick{
display:none;position:absolute;bottom:28px;left:25px;
width:140px;height:140px;border-radius:50%;
background:#203e3655;border:2px solid #ffffff99;
z-index:5;touch-action:none
}
#stick{
position:absolute;width:58px;height:58px;left:39px;top:39px;
border-radius:50%;background:#ffffffbb;border:3px solid white;
pointer-events:none
}
#runButton{
display:none;position:absolute;right:28px;bottom:35px;
width:76px;height:76px;border-radius:50%;
border:2px solid #ffffffaa;background:#203e36bb;color:white;
font-weight:bold;font-size:15px;z-index:5;touch-action:none
}
@media(pointer:coarse){
#joystick,#runButton{display:block}
#instructions{font-size:11px}
#wardrobe{top:65px}
}
</style>
</head>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// FIREBASE
const firebaseConfig={
apiKey:"AIzaSyCIkwXfeAfEZrG1kE0myW8BIRXNq5gOnpE",
authDomain:"our-first-date-kinda-game.firebaseapp.com",
databaseURL:"https://our-first-date-kinda-game-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"our-first-date-kinda-game",
storageBucket:"our-first-date-kinda-game.firebasestorage.app",
messagingSenderId:"176526649038",
appId:"1:176526649038:web:3c6ab02491491e4e8e129f",
measurementId:"G-49HR8VS7TV"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const statusText=document.getElementById('status');

let myUID=null;
let myPlayerRef=null;
let networkReady=false;
const remotePlayers=new Map();

const defaultAppearance={
gender:'boy',
skinColor:'#d99b72',
hairStyle:'short',
hairColor:'#25170f',
eyeColor:'#30251f',
accessory:'none',
topStyle:'tshirt',
topColor:'#398b72',
bottomStyle:'pants',
bottomColor:'#394b68',
shoeColor:'#63452e'
};

let appearance={...defaultAppearance};

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bd8ee);
scene.fog=new THREE.Fog(0x9bd8ee,65,190);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x64804c,2));
const sun=new THREE.DirectionalLight(0xfff2d5,2.3);
sun.position.set(-25,40,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

function material(color){
return new THREE.MeshStandardMaterial({color,roughness:.85});
}

// GROUND
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),material(0x78ae60));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ROAD
const road=new THREE.Mesh(new THREE.PlaneGeometry(13,400),material(0x41474b));
road.rotation.x=-Math.PI/2;
road.position.y=.035;
scene.add(road);

for(const x of [-7.2,7.2]){
const edge=new THREE.Mesh(new THREE.BoxGeometry(.25,.12,400),material(0xe4dfc9));
edge.position.set(x,.08,0);
scene.add(edge);
}

for(let z=-190;z<200;z+=9){
const line=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,4),material(0xf5e7a6));
line.position.set(0,.105,z);
scene.add(line);
}

// PAVEMENTS
for(const x of [-9,9]){
const pavement=new THREE.Mesh(new THREE.BoxGeometry(3,.25,400),material(0xbab9a9));
pavement.position.set(x,.12,0);
scene.add(pavement);
}

// BUILDINGS
const buildingColors=[0xd6b99b,0xc4a6a0,0xd8d0b5,0xa9c5c6,0xd6d1c4,0xb9ad99,0xe0c5a2,0x9db3a6];

function createBuilding(x,z,w,d,h,color){
const group=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));
body.position.y=h/2+.25;
body.castShadow=true;
body.receiveShadow=true;
group.add(body);

const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.35,.35,d+.35),material(0x56504b));
roof.position.y=h+.4;
group.add(roof);

const side=x<0?1:-1;
const columns=Math.max(2,Math.floor(d/2.4));
const rows=Math.max(2,Math.floor(h/2.4));

for(let row=0;row<rows;row++){
for(let col=0;col<columns;col++){
const win=new THREE.Mesh(new THREE.BoxGeometry(.09,1.05,.85),material(Math.random()>.25?0x82c5d9:0xffe3a0));
win.position.set(side*(w/2+.05),1.35+row*2.15,-d/2+1.2+col*(d-1.5)/Math.max(1,columns-1));
group.add(win);
}
}

const door=new THREE.Mesh(new THREE.BoxGeometry(.12,2,.95),material(0x594332));
door.position.set(side*(w/2+.08),1.25,0);
group.add(door);

const sign=new THREE.Mesh(new THREE.BoxGeometry(.16,.55,2.4),material(0x397c72));
sign.position.set(side*(w/2+.12),h*.65,0);
group.add(sign);

group.position.set(x,0,z);
scene.add(group);
}

for(let z=-90;z<=100;z+=19){
createBuilding(-14,z,9,12,9+Math.random()*12,buildingColors[Math.floor(Math.random()*buildingColors.length)]);
createBuilding(14,z,9,12,9+Math.random()*16,buildingColors[Math.floor(Math.random()*buildingColors.length)]);
}

// STREETLIGHTS
function createStreetLight(x,z){
const group=new THREE.Group();
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,5,8),material(0x333b3d));
pole.position.y=2.5;
group.add(pole);

const arm=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,1.1),material(0x333b3d));
arm.position.set(0,4.8,x<0?-.35:.35);
group.add(arm);

const lamp=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),material(0xffe8a3));
lamp.position.set(0,4.7,x<0?-.8:.8);
group.add(lamp);

group.position.set(x,0,z);
scene.add(group);
}

for(let z=-90;z<110;z+=17){
createStreetLight(-7.9,z);
createStreetLight(7.9,z);
}

// TREES
function createTree(x,z,scale=1){
const group=new THREE.Group();
const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.32,2.5,8),material(0x80502f));
trunk.position.y=1.25;
group.add(trunk);

for(let i=0;i<3;i++){
const leaves=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25-i*.13,1),material([0x397f43,0x4d994c,0x67a94f][i]));
leaves.position.set((i-1)*.25,2.8+(i===1?.4:0),0);
group.add(leaves);
}

group.position.set(x,0,z);
group.scale.setScalar(scale);
scene.add(group);
}

for(let z=-100;z<110;z+=13){
createTree(-10.7,z,.8);
createTree(10.7,z,.8);
}

// CHARACTER HELPERS
function part(parent,geo,mat,x,y,z,slot=null){
const mesh=new THREE.Mesh(geo,mat);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
if(slot)mesh.userData.slot=slot;
parent.add(mesh);
return mesh;
}

function roundedPart(parent,x,y,z,sx,sy,sz,mat,slot=null){
const mesh=part(parent,new THREE.SphereGeometry(1,18,14),mat,x,y,z,slot);
mesh.scale.set(sx,sy,sz);
return mesh;
}

// CHARACTER CREATION
function createCharacter(custom=defaultAppearance){
const group=new THREE.Group();

const skinMat=material(custom.skinColor);
const hairMat=material(custom.hairColor);
const shirtMat=material(custom.topColor);
const pantsMat=material(custom.bottomColor);
const shoeMat=material(custom.shoeColor);
const eyeMat=material(custom.eyeColor);
const whiteMat=material(0xffffff);
const darkMat=material(0x29221f);
const accentMat=material(0xffffff);

// Body and neck
const torso=part(group,new THREE.CapsuleGeometry(.37,.62,6,16),shirtMat,0,1.48,0,'top');
torso.scale.set(1,.98,.78);

roundedPart(group,0,1.91,0,.16,.19,.16,skinMat,'skin');

// Head
const head=new THREE.Group();
head.position.set(0,2.34,0);
group.add(head);

roundedPart(head,0,0,0,.34,.39,.31,skinMat,'skin');

// Ears
for(const x of [-.34,.34]){
roundedPart(head,x,-.02,0,.075,.11,.07,skinMat,'skin');
}

// Nose
roundedPart(head,0,-.10,.305,.055,.075,.07,skinMat,'skin');

// Eyes and pupils
for(const x of [-.125,.125]){
roundedPart(head,x,.035,.278,.065,.075,.035,whiteMat);
roundedPart(head,x,-.005,.309,.033,.043,.018,eyeMat,'eyes');
roundedPart(head,x,-.005,.324,.014,.026,.009,darkMat);
const brow=roundedPart(head,x,.135,.285,.07,.018,.025,hairMat,'hair');
brow.rotation.z=x<0?-.12:.12;
}

// Mouth
const mouth=part(head,new THREE.TorusGeometry(.055,.012,6,16,Math.PI),material(0x8d4545),0,-.19,.305);
mouth.rotation.z=Math.PI;

// Hair styles
const hairStyles=new THREE.Group();
head.add(hairStyles);

function hairPiece(geo,x,y,z,sx=1,sy=1,sz=1){
const mesh=part(hairStyles,geo,hairMat,x,y,z,'hair');
mesh.scale.set(sx,sy,sz);
return mesh;
}

const styles={};

// Short hair
styles.short=new THREE.Group();
hairStyles.add(styles.short);
const shortCap=part(styles.short,new THREE.SphereGeometry(.345,18,12,0,Math.PI*2,0,Math.PI*.58),hairMat,0,.15,0,'hair');
shortCap.scale.set(1.04,.95,1);
for(const x of [-.27,.27]){
roundedPart(styles.short,x,.08,.02,.09,.15,.10,hairMat,'hair');
}

// Long hair
styles.long=new THREE.Group();
hairStyles.add(styles.long);
part(styles.long,new THREE.SphereGeometry(.35,18,12,0,Math.PI*2,0,Math.PI*.57),hairMat,0,.15,0,'hair');
roundedPart(styles.long,0,-.19,-.23,.31,.45,.15,hairMat,'hair');
for(const x of [-.29,.29]){
roundedPart(styles.long,x,-.15,-.02,.09,.38,.10,hairMat,'hair');
}

// Curly hair
styles.curly=new THREE.Group();
hairStyles.add(styles.curly);
for(let i=0;i<13;i++){
const a=i/13*Math.PI*2;
roundedPart(styles.curly,Math.cos(a)*.24,.17+Math.sin(i*2)*.04,Math.sin(a)*.22,.13,.13,.13,hairMat,'hair');
}
roundedPart(styles.curly,0,.25,0,.27,.18,.27,hairMat,'hair');

// Braids
styles.braids=new THREE.Group();
hairStyles.add(styles.braids);
part(styles.braids,new THREE.SphereGeometry(.345,18,12,0,Math.PI*2,0,Math.PI*.58),hairMat,0,.15,0,'hair');
for(const x of [-.28,.28]){
for(let i=0;i<4;i++){
roundedPart(styles.braids,x,-.04-i*.13,.01,.075,.12,.075,hairMat,'hair');
}
roundedPart(styles.braids,x,-.56,.02,.09,.09,.09,hairMat,'hair');
}

// Ponytail
styles.ponytail=new THREE.Group();
hairStyles.add(styles.ponytail);
part(styles.ponytail,new THREE.SphereGeometry(.345,18,12,0,Math.PI*2,0,Math.PI*.58),hairMat,0,.15,0,'hair');
roundedPart(styles.ponytail,0,.03,-.34,.12,.14,.13,hairMat,'hair');
roundedPart(styles.ponytail,0,-.25,-.43,.10,.30,.10,hairMat,'hair');

// Bun
styles.bun=new THREE.Group();
hairStyles.add(styles.bun);
part(styles.bun,new THREE.SphereGeometry(.345,18,12,0,Math.PI*2,0,Math.PI*.58),hairMat,0,.15,0,'hair');
roundedPart(styles.bun,0,.43,-.08,.17,.17,.17,hairMat,'hair');

// Arms
function createArm(x){
const pivot=new THREE.Group();
pivot.position.set(x,1.78,0);
group.add(pivot);

const sleeve=part(pivot,new THREE.CapsuleGeometry(.125,.48,5,12),shirtMat,0,-.30,0,'top');
sleeve.rotation.z=x<0?-.10:.10;

roundedPart(pivot,0,-.61,.015,.12,.13,.12,skinMat,'skin');

const tankArm=part(pivot,new THREE.CapsuleGeometry(.105,.46,5,12),skinMat,0,-.30,0,'skin');
tankArm.visible=false;
pivot.userData.sleeve=sleeve;
pivot.userData.tankArm=tankArm;

return pivot;
}

// Legs
function createLeg(x){
const pivot=new THREE.Group();
pivot.position.set(x,.86,0);
group.add(pivot);

const pants=part(pivot,new THREE.CapsuleGeometry(.155,.48,5,12),pantsMat,0,-.28,0,'bottom');
const shorts=part(pivot,new THREE.CapsuleGeometry(.16,.25,5,12),pantsMat,0,-.18,0,'bottom');
const shoe=roundedPart(pivot,0,-.61,.12,.17,.12,.27,shoeMat,'shoes');

pivot.userData.pants=pants;
pivot.userData.shorts=shorts;
pivot.userData.shoe=shoe;

return pivot;
}

const leftArm=createArm(-.46);
const rightArm=createArm(.46);
const leftLeg=createLeg(-.19);
const rightLeg=createLeg(.19);

// Skirt
const skirt=part(group,new THREE.CylinderGeometry(.30,.48,.43,20,1,true),pantsMat,0,.91,0,'skirt');
skirt.visible=false;

// Hoodie hood
const hood=roundedPart(group,0,1.72,-.28,.25,.28,.12,shirtMat,'top');
hood.visible=false;

// Shirt collar
const collar=part(group,new THREE.TorusGeometry(.16,.035,8,20),accentMat,0,1.84,0);
collar.rotation.x=Math.PI/2;

// Accessories
const glasses=new THREE.Group();
head.add(glasses);
for(const x of [-.13,.13]){
const ring=part(glasses,new THREE.TorusGeometry(.075,.012,6,16),darkMat,x,.035,.31);
ring.scale.set(1,1,.7);
}
part(glasses,new THREE.BoxGeometry(.13,.018,.018),darkMat,0,.035,.31);
glasses.visible=false;

const headband=part(head,new THREE.TorusGeometry(.32,.035,8,24),material(0xd7a5c4),0,.18,0);
headband.scale.set(1,1,.9);
headband.visible=false;

const character={
group,torso,leftArm,rightArm,leftLeg,rightLeg,
styles,glasses,headband,skirt,hood
};

applyAppearance(character,custom);
return character;
}

// APPLY CUSTOMISATION WITHOUT REBUILDING MOVEMENT JOINTS
function applyAppearance(character,custom){
const a={...defaultAppearance,...custom};

character.group.traverse(obj=>{
if(!obj.isMesh)return;
const slot=obj.userData.slot;
if(slot==='skin')obj.material.color.set(a.skinColor);
if(slot==='hair')obj.material.color.set(a.hairColor);
if(slot==='top')obj.material.color.set(a.topColor);
if(slot==='bottom'||slot==='skirt')obj.material.color.set(a.bottomColor);
if(slot==='shoes')obj.material.color.set(a.shoeColor);
if(slot==='eyes')obj.material.color.set(a.eyeColor);
});

for(const [name,style] of Object.entries(character.styles)){
style.visible=name===a.hairStyle;
}

character.glasses.visible=a.accessory==='glasses';
character.headband.visible=a.accessory==='headband';

const isTank=a.topStyle==='tank';
character.leftArm.userData.sleeve.visible=!isTank;
character.rightArm.userData.sleeve.visible=!isTank;
character.leftArm.userData.tankArm.visible=isTank;
character.rightArm.userData.tankArm.visible=isTank;

character.hood.visible=a.topStyle==='hoodie';

character.leftLeg.userData.pants.visible=a.bottomStyle==='pants';
character.rightLeg.userData.pants.visible=a.bottomStyle==='pants';
character.leftLeg.userData.shorts.visible=a.bottomStyle==='shorts';
character.rightLeg.userData.shorts.visible=a.bottomStyle==='shorts';
character.skirt.visible=a.bottomStyle==='skirt';

// Small body proportion differences between the two character styles
character.torso.scale.x=a.gender==='girl'?.94:1;
character.group.userData.appearanceSignature=JSON.stringify(a);
}

// LOCAL PLAYER
const character=createCharacter(appearance);
const player=character.group;
scene.add(player);
player.position.set(0,0,5);

// CHARACTER CREATOR UI
const appearanceFields=[
'gender','skinColor','hairStyle','hairColor','eyeColor',
'accessory','topStyle','topColor','bottomStyle','bottomColor','shoeColor'
];

function readAppearanceFromUI(){
for(const field of appearanceFields){
appearance[field]=document.getElementById(field).value;
}
applyAppearance(character,appearance);
}

for(const field of appearanceFields){
document.getElementById(field).addEventListener('change',readAppearanceFromUI);
}

function loadAppearanceIntoUI(a){
for(const field of appearanceFields){
const element=document.getElementById(field);
if(a[field])element.value=a[field];
}
}

function openCreator(){
document.getElementById('start').style.display='flex';
document.getElementById('wardrobe').style.display='none';
if(document.pointerLockElement)document.exitPointerLock();
}

function closeCreator(){
readAppearanceFromUI();
document.getElementById('start').style.display='none';
document.getElementById('wardrobe').style.display='block';

if(matchMedia('(pointer:fine)').matches){
renderer.domElement.requestPointerLock();
}

sendMyPosition();
}

document.getElementById('enterButton').addEventListener('click',closeCreator);
document.getElementById('wardrobe').addEventListener('click',openCreator);

// INPUT
const keys={};
let yaw=0;
let pitch=.12;
let running=false;
let localMoving=false;
let localSprinting=false;
let walkPhase=0;

window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',()=>{
for(const key in keys)keys[key]=false;
running=false;
});

// RUN BUTTON
const runButton=document.getElementById('runButton');
runButton.addEventListener('pointerdown',e=>{
e.preventDefault();
running=true;
});
for(const eventName of ['pointerup','pointerleave','pointercancel']){
runButton.addEventListener(eventName,()=>running=false);
}

// JOYSTICK
const joystick=document.getElementById('joystick');
const stick=document.getElementById('stick');
let joystickPointer=null;
let joyX=0;
let joyY=0;

function resetJoystick(){
joyX=0;
joyY=0;
joystickPointer=null;
stick.style.transform='translate(0px,0px)';
}

function updateJoystick(e){
const rect=joystick.getBoundingClientRect();
const centerX=rect.left+rect.width/2;
const centerY=rect.top+rect.height/2;
let dx=e.clientX-centerX;
let dy=e.clientY-centerY;
const maxDistance=48;
const distance=Math.hypot(dx,dy);

if(distance>maxDistance){
dx=dx/distance*maxDistance;
dy=dy/distance*maxDistance;
}

joyX=dx/maxDistance;
joyY=dy/maxDistance;
stick.style.transform=`translate(${dx}px,${dy}px)`;
}

joystick.addEventListener('pointerdown',e=>{
e.preventDefault();
if(joystickPointer!==null)return;
joystickPointer=e.pointerId;
joystick.setPointerCapture(e.pointerId);
updateJoystick(e);
});

joystick.addEventListener('pointermove',e=>{
if(e.pointerId!==joystickPointer)return;
e.preventDefault();
updateJoystick(e);
});

joystick.addEventListener('pointerup',e=>{
if(e.pointerId===joystickPointer)resetJoystick();
});
joystick.addEventListener('pointercancel',resetJoystick);
joystick.addEventListener('lostpointercapture',resetJoystick);

// PC CAMERA
document.addEventListener('mousemove',e=>{
if(document.pointerLockElement!==renderer.domElement)return;
yaw-=e.movementX*.003;
pitch+=e.movementY*.002;
pitch=THREE.MathUtils.clamp(pitch,-.65,.65);
});

// IPAD CAMERA
let cameraPointer=null;
let touchX=0;
let touchY=0;

renderer.domElement.addEventListener('pointerdown',e=>{
if(e.pointerType!=='touch')return;
if(e.clientX<innerWidth*.42)return;
cameraPointer=e.pointerId;
renderer.domElement.setPointerCapture(e.pointerId);
touchX=e.clientX;
touchY=e.clientY;
});

renderer.domElement.addEventListener('pointermove',e=>{
if(e.pointerId!==cameraPointer)return;
const dx=e.clientX-touchX;
const dy=e.clientY-touchY;
yaw-=dx*.006;
pitch+=dy*.004;
pitch=THREE.MathUtils.clamp(pitch,-.65,.65);
touchX=e.clientX;
touchY=e.clientY;
});

function releaseCamera(e){
if(e.pointerId===cameraPointer)cameraPointer=null;
}
renderer.domElement.addEventListener('pointerup',releaseCamera);
renderer.domElement.addEventListener('pointercancel',releaseCamera);
renderer.domElement.addEventListener('lostpointercapture',releaseCamera);

// MULTIPLAYER
async function connectMultiplayer(){
try{
const result=await signInAnonymously(auth);
myUID=result.user.uid;
myPlayerRef=ref(db,'players/'+myUID);

await onDisconnect(myPlayerRef).remove();

await set(myPlayerRef,{
x:player.position.x,
z:player.position.z,
rotation:player.rotation.y,
moving:false,
running:false,
appearance:appearance,
updatedAt:Date.now()
});

networkReady=true;

onValue(ref(db,'players'),snapshot=>{
snapshot.forEach(child=>{
const id=child.key;
const data=child.val();

if(id===myUID||!data)return;

let other=remotePlayers.get(id);

if(!other){
other=createCharacter(data.appearance||defaultAppearance);
other.group.position.set(Number(data.x)||0,0,Number(data.z)||0);
other.group.rotation.y=Number(data.rotation)||0;

other.group.userData.targetPosition=new THREE.Vector3(
Number(data.x)||0,0,Number(data.z)||0
);
other.group.userData.targetRotation=Number(data.rotation)||0;
other.group.userData.targetMoving=data.moving===true;
other.group.userData.targetRunning=data.running===true;
other.group.userData.animationPhase=0;

scene.add(other.group);
remotePlayers.set(id,other);
}else{
const incoming=JSON.stringify({...defaultAppearance,...(data.appearance||{})});
const current=other.group.userData.appearanceSignature;

if(incoming!==current){
const oldGroup=other.group;
const state=oldGroup.userData;
const replacement=createCharacter(data.appearance||defaultAppearance);

replacement.group.position.copy(oldGroup.position);
replacement.group.rotation.copy(oldGroup.rotation);
replacement.group.userData=state;
replacement.group.userData.appearanceSignature=incoming;

scene.remove(oldGroup);
scene.add(replacement.group);
other=replacement;
remotePlayers.set(id,other);
}
}

const state=other.group.userData;

state.targetPosition.set(
Number(data.x)||0,0,Number(data.z)||0
);

if(Number.isFinite(Number(data.rotation))){
state.targetRotation=Number(data.rotation);
}

state.targetMoving=data.moving===true;
state.targetRunning=data.running===true;
});

for(const [id,other] of remotePlayers){
if(!snapshot.hasChild(id)){
scene.remove(other.group);
remotePlayers.delete(id);
}
}

statusText.textContent=remotePlayers.size>0
?'🟢 Multiplayer · '+(remotePlayers.size+1)+' players'
:'🟢 Connected · Waiting for Tina';
},error=>{
console.error('Multiplayer read error:',error);
statusText.textContent='🔴 Multiplayer read error';
});

}catch(error){
console.error('Firebase connection error:',error);
statusText.textContent='🔴 Connection failed';
}
}

connectMultiplayer();

// SEND POSITION AND APPEARANCE
let lastSent=0;

function sendMyPosition(){
if(!networkReady||!myPlayerRef)return;

set(myPlayerRef,{
x:player.position.x,
z:player.position.z,
rotation:player.rotation.y,
moving:localMoving,
running:localSprinting,
appearance:appearance,
updatedAt:Date.now()
}).catch(error=>{
console.error('Position update failed:',error);
});
}

// GAME LOOP
const clock=new THREE.Clock();
const targetCamera=new THREE.Vector3();

function animate(){
requestAnimationFrame(animate);

const delta=Math.min(clock.getDelta(),.05);
const time=clock.elapsedTime;

let forward=0;
let sideways=0;

if(keys.w||keys.arrowup)forward+=1;
if(keys.s||keys.arrowdown)forward-=1;
if(keys.d||keys.arrowright)sideways+=1;
if(keys.a||keys.arrowleft)sideways-=1;

forward+=-joyY;
sideways+=joyX;

const length=Math.hypot(forward,sideways);
const moving=length>.08;
const sprint=keys.shift||running;

localMoving=moving;
localSprinting=moving&&sprint;

if(moving){
forward/=length;
sideways/=length;

const dx=-Math.sin(yaw)*forward+Math.cos(yaw)*sideways;
const dz=-Math.cos(yaw)*forward-Math.sin(yaw)*sideways;
const speed=sprint?10:5.5;

player.position.x+=dx*speed*delta;
player.position.z+=dz*speed*delta;
walkPhase+=delta*(sprint?13:9);
}

// LOCAL CHARACTER FACING
player.rotation.y=Math.PI+yaw;

const swing=moving?Math.sin(walkPhase)*.65:0;
character.leftLeg.rotation.x=swing;
character.rightLeg.rotation.x=-swing;
character.leftArm.rotation.x=-swing*.8;
character.rightArm.rotation.x=swing*.8;

character.torso.scale.y=.95+Math.sin(time*2)*.012;

player.position.y=moving
?Math.abs(Math.sin(walkPhase*2))*.045
:Math.sin(time*2)*.015;

// REMOTE CHARACTERS
for(const other of remotePlayers.values()){
const data=other.group.userData;

other.group.position.lerp(
data.targetPosition,
Math.min(1,delta*12)
);

const rotationDifference=Math.atan2(
Math.sin(data.targetRotation-other.group.rotation.y),
Math.cos(data.targetRotation-other.group.rotation.y)
);

other.group.rotation.y+=rotationDifference*Math.min(1,delta*12);

if(data.targetMoving){
data.animationPhase+=delta*(data.targetRunning?13:9);
}

const remoteSwing=data.targetMoving
?Math.sin(data.animationPhase)*.65
:0;

other.leftLeg.rotation.x=remoteSwing;
other.rightLeg.rotation.x=-remoteSwing;
other.leftArm.rotation.x=-remoteSwing*.8;
other.rightArm.rotation.x=remoteSwing*.8;

other.torso.scale.y=.95+Math.sin(time*2)*.012;

const bounce=data.targetMoving
?Math.abs(Math.sin(data.animationPhase*2))*.045
:Math.sin(time*2)*.015;

other.group.position.y=THREE.MathUtils.lerp(
other.group.position.y,bounce,Math.min(1,delta*10)
);
}

// CAMERA
const horizontal=7*Math.cos(pitch);

targetCamera.set(
player.position.x+Math.sin(yaw)*horizontal,
player.position.y+2.2+7*Math.sin(pitch),
player.position.z+Math.cos(yaw)*horizontal
);

camera.position.lerp(targetCamera,.16);
camera.lookAt(player.position.x,player.position.y+1.45,player.position.z);

if(time-lastSent>.08){
sendMyPosition();
lastSent=time;
}

renderer.render(scene,camera);
}

animate();

// RESIZE
window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
