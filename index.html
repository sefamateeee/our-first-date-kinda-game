<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our First Date Kinda Game</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
overflow: hidden;
font-family: Arial, sans-serif;
background: #87ceeb;
}

canvas {
display: block;
}

#instructions {
position: absolute;
top: 20px;
left: 50%;
transform: translateX(-50%);
color: white;
background: rgba(0, 0, 0, 0.45);
padding: 12px 18px;
border-radius: 12px;
text-align: center;
font-size: 14px;
line-height: 1.6;
pointer-events: none;
}

#start {
position: absolute;
inset: 0;
display: flex;
justify-content: center;
align-items: center;
background: rgba(0, 0, 0, 0.35);
color: white;
text-align: center;
cursor: pointer;
z-index: 5;
}

#start div {
background: rgba(0, 0, 0, 0.65);
padding: 25px;
border-radius: 18px;
max-width: 320px;
}

#start h1 {
font-size: 25px;
margin-bottom: 12px;
}

#start p {
line-height: 1.5;
}

#touchControls {
display: none;
position: absolute;
bottom: 25px;
left: 20px;
z-index: 4;
gap: 8px;
}

.moveButton {
width: 55px;
height: 55px;
border: 0;
border-radius: 14px;
background: rgba(0, 0, 0, 0.45);
color: white;
font-size: 22px;
touch-action: none;
}

@media (pointer: coarse) {
#touchControls {
display: grid;
grid-template-columns: repeat(3, 55px);
grid-template-rows: repeat(2, 55px);
}
}
</style>
</head>

<body>

<div id="start">
<div>
<h1>Our First Date kinda game</h1>
<p>Click to start exploring</p>
<p style="margin-top: 10px; font-size: 13px;">
WASD to move · Shift to run<br>
Move your mouse to look around
</p>
</div>
</div>

<div id="instructions">
WASD – Move<br>
SHIFT – Run<br>
Mouse – Look around
</div>

<div id="touchControls">
<button class="moveButton" data-key="w" style="grid-column: 2;">↑</button>
<button class="moveButton" data-key="a" style="grid-column: 1;">←</button>
<button class="moveButton" data-key="s" style="grid-column: 2;">↓</button>
<button class="moveButton" data-key="d" style="grid-column: 3;">→</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

// CAMERA
const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth / window.innerHeight,
0.1,
1000
);

// RENDERER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// LIGHTING
const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(20, 30, 10);
sunlight.castShadow = true;
scene.add(sunlight);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));

// GROUND
const ground = new THREE.Mesh(
new THREE.PlaneGeometry(200, 200),
new THREE.MeshStandardMaterial({ color: 0x55a84f })
);

ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// PATH
const path = new THREE.Mesh(
new THREE.PlaneGeometry(8, 200),
new THREE.MeshStandardMaterial({ color: 0xc2aa83 })
);

path.rotation.x = -Math.PI / 2;
path.position.y = 0.02;
path.receiveShadow = true;
scene.add(path);

// TREES
function createTree(x, z) {
const tree = new THREE.Group();

const trunk = new THREE.Mesh(
new THREE.CylinderGeometry(0.25, 0.35, 3, 8),
new THREE.MeshStandardMaterial({ color: 0x70452b })
);

trunk.position.y = 1.5;
trunk.castShadow = true;
tree.add(trunk);

const leaves = new THREE.Mesh(
new THREE.SphereGeometry(1.5, 12, 12),
new THREE.MeshStandardMaterial({ color: 0x237a35 })
);

leaves.position.y = 3.6;
leaves.castShadow = true;
tree.add(leaves);

tree.position.set(x, 0, z);
scene.add(tree);
}

for (let i = -8; i <= 8; i += 2) {
createTree(-9, i * 4);
createTree(9, i * 4);
}

// CHARACTER
const player = new THREE.Group();
scene.add(player);

const skinMaterial = new THREE.MeshStandardMaterial({
color: 0xd9a078
});

const hoodieMaterial = new THREE.MeshStandardMaterial({
color: 0x344f75
});

const pantsMaterial = new THREE.MeshStandardMaterial({
color: 0x292d38
});

const shoeMaterial = new THREE.MeshStandardMaterial({
color: 0xeeeeee
});

// BODY
const body = new THREE.Mesh(
new THREE.CylinderGeometry(0.38, 0.42, 1.15, 12),
hoodieMaterial
);

body.position.y = 1.55;
body.castShadow = true;
player.add(body);

// HEAD
const head = new THREE.Mesh(
new THREE.SphereGeometry(0.38, 16, 16),
skinMaterial
);

head.position.y = 2.45;
head.castShadow = true;
player.add(head);

// HAIR
const hair = new THREE.Mesh(
new THREE.SphereGeometry(0.4, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
new THREE.MeshStandardMaterial({ color: 0x21170f })
);

hair.position.y = 2.55;
player.add(hair);

// EYES - CHARACTER FACES LOCAL POSITIVE Z
function createEye(x) {
const eye = new THREE.Mesh(
new THREE.SphereGeometry(0.045, 8, 8),
new THREE.MeshStandardMaterial({ color: 0x171717 })
);

eye.position.set(x, 2.48, 0.345);
player.add(eye);
}

createEye(-0.13);
createEye(0.13);

// ARMS
function createArm(x) {
const arm = new THREE.Mesh(
new THREE.CylinderGeometry(0.13, 0.15, 0.9, 10),
hoodieMaterial
);

arm.position.set(x, 1.55, 0);
arm.rotation.z = x > 0 ? -0.12 : 0.12;
arm.castShadow = true;
player.add(arm);
}

createArm(-0.5);
createArm(0.5);

// LEGS
function createLeg(x) {
const leg = new THREE.Mesh(
new THREE.CylinderGeometry(0.17, 0.18, 0.85, 10),
pantsMaterial
);

leg.position.set(x, 0.62, 0);
leg.castShadow = true;
player.add(leg);
}

createLeg(-0.2);
createLeg(0.2);

// SHOES
function createShoe(x) {
const shoe = new THREE.Mesh(
new THREE.BoxGeometry(0.32, 0.18, 0.48),
shoeMaterial
);

shoe.position.set(x, 0.14, 0.1);
shoe.castShadow = true;
player.add(shoe);
}

createShoe(-0.2);
createShoe(0.2);

// PLAYER POSITION
player.position.set(0, 0, 5);

// CAMERA CONTROLS
let yaw = 0;
let pitch = 0.25;
const cameraDistance = 7;

// KEYBOARD
const keys = {};

window.addEventListener('keydown', (event) => {
keys[event.key.toLowerCase()] = true;
});

window.addEventListener('keyup', (event) => {
keys[event.key.toLowerCase()] = false;
});

// MOUSE CAMERA
document.addEventListener('mousemove', (event) => {
if (document.pointerLockElement !== renderer.domElement) return;

// Corrected horizontal camera direction
yaw -= event.movementX * 0.003;

pitch = Math.max(
-0.15,
Math.min(0.85, pitch - event.movementY * 0.002)
);
});

// START GAME
const startScreen = document.getElementById('start');

startScreen.addEventListener('click', () => {
startScreen.style.display = 'none';

if (window.matchMedia('(pointer: fine)').matches) {
renderer.domElement.requestPointerLock();
}
});

// TOUCH MOVEMENT
document.querySelectorAll('.moveButton').forEach((button) => {
const key = button.dataset.key;

button.addEventListener('pointerdown', (event) => {
event.preventDefault();
keys[key] = true;
});

button.addEventListener('pointerup', () => {
keys[key] = false;
});

button.addEventListener('pointerleave', () => {
keys[key] = false;
});

button.addEventListener('pointercancel', () => {
keys[key] = false;
});
});

// TOUCH CAMERA LOOK
let lastTouchX = 0;
let lastTouchY = 0;
let looking = false;

renderer.domElement.addEventListener('pointerdown', (event) => {
if (event.pointerType !== 'touch') return;

lastTouchX = event.clientX;
lastTouchY = event.clientY;
looking = true;
});

renderer.domElement.addEventListener('pointermove', (event) => {
if (!looking || event.pointerType !== 'touch') return;

const dx = event.clientX - lastTouchX;
const dy = event.clientY - lastTouchY;

// Corrected horizontal touch camera direction
yaw -= dx * 0.006;

pitch = Math.max(
-0.15,
Math.min(0.85, pitch - dy * 0.004)
);

lastTouchX = event.clientX;
lastTouchY = event.clientY;
});

renderer.domElement.addEventListener('pointerup', () => {
looking = false;
});

renderer.domElement.addEventListener('pointercancel', () => {
looking = false;
});

// GAME LOOP
function animate() {
requestAnimationFrame(animate);

let forward = 0;
let sideways = 0;

if (keys['w'] || keys['arrowup']) forward += 1;
if (keys['s'] || keys['arrowdown']) forward -= 1;
if (keys['d'] || keys['arrowright']) sideways += 1;
if (keys['a'] || keys['arrowleft']) sideways -= 1;

const moving = forward !== 0 || sideways !== 0;
const speed = keys['shift'] ? 0.16 : 0.09;

if (moving) {
const length = Math.sqrt(
forward * forward + sideways * sideways
);

forward /= length;
sideways /= length;

const dx =
Math.sin(yaw) * forward +
Math.cos(yaw) * sideways;

const dz =
-Math.cos(yaw) * forward +
Math.sin(yaw) * sideways;

player.position.x += dx * speed;
player.position.z += dz * speed;

// Corrected character facing direction
player.rotation.y = Math.atan2(dx, dz);
}

// CAMERA FOLLOWS PLAYER
const cameraX =
player.position.x +
Math.sin(yaw) * cameraDistance * Math.cos(pitch);

const cameraZ =
player.position.z +
Math.cos(yaw) * cameraDistance * Math.cos(pitch);

const cameraY =
player.position.y +
2.5 +
cameraDistance * Math.sin(pitch);

camera.position.set(cameraX, cameraY, cameraZ);

camera.lookAt(
player.position.x,
player.position.y + 1.5,
player.position.z
);

renderer.render(scene, camera);
}

animate();

// WINDOW RESIZE
window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
