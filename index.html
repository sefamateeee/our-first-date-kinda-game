<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our First Date Kinda Game</title>
<style>
* { box-sizing: border-box; }
body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }
#info {
position:fixed;top:15px;left:15px;z-index:2;
color:white;background:#0009;padding:12px 18px;
border-radius:12px;pointer-events:none;
}
#help {
position:fixed;bottom:15px;left:15px;z-index:2;
color:white;background:#0009;padding:12px;
border-radius:12px;font-size:13px;
}
</style>
</head>
<body>
<div id="info">Our First Date Kinda Game</div>
<div id="help">WASD: Move | Mouse: Look | Shift: Run</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c8ed);
scene.fog = new THREE.Fog(0x91c8ed,35,110);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x6d8059,2));

const sun = new THREE.DirectionalLight(0xfff1d5,2.5);
sun.position.set(-15,25,12);
sun.castShadow=true;
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({color:c,roughness:.85});

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(250,250),mat(0x65a95c)
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

const path = new THREE.Mesh(
new THREE.PlaneGeometry(5,150),mat(0xc6ad8d)
);
path.rotation.x=-Math.PI/2;
path.position.set(0,.015,-12);
scene.add(path);

// PLAYER
const player = new THREE.Group();
scene.add(player);

const skin=mat(0xd69b76);
const hoodie=mat(0x263b61);
const pants=mat(0x242b3b);
const shoes=mat(0xe9e7e1);

function part(parent,geometry,material,x,y,z){
const mesh=new THREE.Mesh(geometry,material);
mesh.position.set(x,y,z);
mesh.castShadow=true;
mesh.receiveShadow=true;
parent.add(mesh);
return mesh;
}

// Body
part(player,new THREE.CylinderGeometry(.31,.36,.85,16),hoodie,0,1.38,0);

// Head
const head=part(player,new THREE.SphereGeometry(.28,24,24),skin,0,2.02,0);
head.scale.set(.88,1.12,.9);

// Hair
const hair=part(player,new THREE.SphereGeometry(.29,20,16),mat(0x211a17),0,2.22,0);
hair.scale.set(1,.55,1);

// Hood
part(player,new THREE.SphereGeometry(.27,16,12),mat(0x192b48),0,1.82,-.15);

// Arms
const leftArm=new THREE.Group();
leftArm.position.set(-.39,1.72,0);
player.add(leftArm);
part(leftArm,new THREE.CylinderGeometry(.105,.13,.65,12),hoodie,0,-.28,0);
part(leftArm,new THREE.SphereGeometry(.12,12,12),skin,0,-.65,0);

const rightArm=new THREE.Group();
rightArm.position.set(.39,1.72,0);
player.add(rightArm);
part(rightArm,new THREE.CylinderGeometry(.105,.13,.65,12),hoodie,0,-.28,0);
part(rightArm,new THREE.SphereGeometry(.12,12,12),skin,0,-.65,0);

// Legs
const legs=[];
for(const x of [-.18,.18]){
const leg=new THREE.Group();
leg.position.set(x,.98,0);
player.add(leg);
part(leg,new THREE.CylinderGeometry(.13,.14,.78,12),pants,0,-.32,0);
part(leg,new THREE.BoxGeometry(.23,.14,.38),shoes,0,-.78,.09);
legs.push(leg);
}

// Face
for(const x of [-.09,.09]){
const eye=part(player,new THREE.SphereGeometry(.025,12,12),mat(0x241b18),x,2.05,.245);
eye.scale.set(1,1,.5);
}

// Trees
for(let i=0;i<45;i++){
const tree=new THREE.Group();
part(tree,new THREE.CylinderGeometry(.15,.22,1.8,8),mat(0x765035),0,.9,0);
const leaves=part(tree,new THREE.SphereGeometry(1,12,12),mat(0x328348),0,2.35,0);
leaves.scale.set(1.1,1.25,1.1);
tree.position.set((Math.random()-.5)*85,0,-Math.random()*90);
if(Math.abs(tree.position.x)<5)
tree.position.x+=Math.sign(tree.position.x||1)*8;
scene.add(tree);
}

// MOVEMENT
const keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let yaw=0;
let pitch=.16;

renderer.domElement.addEventListener('click',()=>{
renderer.domElement.requestPointerLock?.();
});

document.addEventListener('mousemove',e=>{
if(document.pointerLockElement===renderer.domElement){
yaw-=e.movementX*.003;
pitch=Math.max(-.15,Math.min(.85,pitch-e.movementY*.002));
}
});

// Touch camera controls
let lastX=0,lastY=0;

renderer.domElement.addEventListener('touchstart',e=>{
if(e.touches.length===1){
lastX=e.touches[0].clientX;
lastY=e.touches[0].clientY;
}
},{passive:true});

renderer.domElement.addEventListener('touchmove',e=>{
if(e.touches.length===1){
const dx=e.touches[0].clientX-lastX;
const dy=e.touches[0].clientY-lastY;
yaw-=dx*.006;
pitch=Math.max(-.15,Math.min(.85,pitch-dy*.004));
lastX=e.touches[0].clientX;
lastY=e.touches[0].clientY;
}
},{passive:true});

// GAME LOOP
const clock=new THREE.Clock();
let walking=0;

function animate(){
requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),.05);

let forward=(keys.w?1:0)-(keys.s?1:0);
let sideways=(keys.d?1:0)-(keys.a?1:0);
const moving=forward!==0||sideways!==0;
const speed=(keys.shift?7:4)*dt;

if(moving){
const dx=Math.sin(yaw)*forward+Math.cos(yaw)*sideways;
const dz=-Math.cos(yaw)*forward+Math.sin(yaw)*sideways;
const length=Math.hypot(dx,dz);

player.position.x+=dx/length*speed;
player.position.z+=dz/length*speed;

// Character faces direction of travel
player.rotation.y=Math.atan2(dx,-dz)+Math.PI;

walking+=dt*(keys.shift?13:8);
}else{
walking+=dt*2;
}

legs.forEach((leg,i)=>{
leg.rotation.x=moving?Math.sin(walking+i*Math.PI)*.55:0;
});

leftArm.rotation.x=moving?Math.sin(walking+Math.PI)*.4:0;
rightArm.rotation.x=moving?Math.sin(walking)*.4:0;

// FOLLOW CAMERA
const distance=6;
const target=new THREE.Vector3(
player.position.x+Math.sin(yaw)*distance*Math.cos(pitch),
player.position.y+3-distance*Math.sin(pitch),
player.position.z+Math.cos(yaw)*distance*Math.cos(pitch)
);

camera.position.lerp(target,1-Math.exp(-6*dt));
camera.lookAt(player.position.x,1.4,player.position.z);

renderer.render(scene,camera);
}

camera.position.set(0,4,7);
animate();

addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
