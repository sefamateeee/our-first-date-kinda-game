<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tina's Bakery - 3D Test</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #e8dfd2;
font-family: Arial, sans-serif;
}
#info {
position: absolute;
top: 15px;
left: 15px;
padding: 12px 16px;
background: rgba(255,255,255,0.9);
border-radius: 10px;
color: #44382e;
z-index: 2;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
}
}
</script>
</head>

<body>
<div id="info">Tina's Bakery – Loading 3D model...</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8dfd2);

const camera = new THREE.PerspectiveCamera(
50, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(8, 15, 10);
sun.castShadow = true;
scene.add(sun);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(200, 200),
new THREE.MeshStandardMaterial({ color: 0xd5c9b9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);
// ===== TINA'S BAKERY BUILDING =====

const bakeryBuilding = new THREE.Group();
scene.add(bakeryBuilding);

// Building dimensions
const bakeryWidth = 20;
const bakeryDepth = 16;

// Materials
const whiteWall = new THREE.MeshStandardMaterial({
color: 0xf4f3ef,
roughness: 0.85
});

const floorMaterial = new THREE.MeshStandardMaterial({
color: 0xc5a783,
roughness: 0.8
});

// Bakery floor
const bakeryFloor = new THREE.Mesh(
new THREE.BoxGeometry(bakeryWidth, 0.25, bakeryDepth),
floorMaterial
);

bakeryFloor.position.y = 0;
bakeryBuilding.add(bakeryFloor);

// Foundation
const foundation = new THREE.Mesh(
new THREE.BoxGeometry(bakeryWidth + 0.4, 0.35, bakeryDepth + 0.4),
new THREE.MeshStandardMaterial({ color: 0x777777 })
);

foundation.position.y = -0.3;
bakeryBuilding.add(foundation);

// Main exterior walls
function bakeryWall(width, height, depth, x, y, z) {
const wall = new THREE.Mesh(
new THREE.BoxGeometry(width, height, depth),
whiteWall
);

wall.position.set(x, y, z);
wall.castShadow = true;
wall.receiveShadow = true;
bakeryBuilding.add(wall);
return wall;
}

const wallHeight = 4.2;
const wallThickness = 0.25;

// Back wall
bakeryWall(
bakeryWidth, wallHeight, wallThickness,
0, wallHeight / 2, -bakeryDepth / 2
);

// Left wall
bakeryWall(
wallThickness, wallHeight, bakeryDepth,
-bakeryWidth / 2, wallHeight / 2, 0
);

// Right wall
bakeryWall(
wallThickness, wallHeight, bakeryDepth,
bakeryWidth / 2, wallHeight / 2, 0
);

// Flat roof
const bakeryRoof = new THREE.Mesh(
new THREE.BoxGeometry(bakeryWidth + 0.5, 0.3, bakeryDepth + 0.5),
new THREE.MeshStandardMaterial({ color: 0xeeeeeb })
);

bakeryRoof.position.y = wallHeight + 0.15;
bakeryBuilding.add(bakeryRoof);
// ===== TINA'S BAKERY - FRONT ENTRANCE =====

const frontGlass = new THREE.MeshPhysicalMaterial({
color: 0xeaf5f5,
transparent: true,
opacity: 0.32,
roughness: 0.15,
metalness: 0.05
});

const darkFrame = new THREE.MeshStandardMaterial({
color: 0x292c2d,
metalness: 0.65,
roughness: 0.3
});

const warmLED = new THREE.MeshStandardMaterial({
color: 0xffd28a,
emissive: 0xffa52b,
emissiveIntensity: 3
});

function bakeryFrontBox(w, h, d, x, y, z, mat) {
const mesh = new THREE.Mesh(
new THREE.BoxGeometry(w, h, d),
mat
);
mesh.position.set(x, y, z);
mesh.castShadow = true;
bakeryBuilding.add(mesh);
return mesh;
}

// Large glass shopfront windows
bakeryFrontBox(7.5, 3.2, 0.12, -5.1, 2.1, 8, frontGlass);
bakeryFrontBox(7.5, 3.2, 0.12, 5.1, 2.1, 8, frontGlass);

// Glass double entrance doors
bakeryFrontBox(1.35, 3.2, 0.12, -0.7, 2.1, 8, frontGlass);
bakeryFrontBox(1.35, 3.2, 0.12, 0.7, 2.1, 8, frontGlass);

// Dark frames around windows
bakeryFrontBox(0.12, 3.5, 0.2, -9, 2.1, 8.05, darkFrame);
bakeryFrontBox(0.12, 3.5, 0.2, 9, 2.1, 8.05, darkFrame);
bakeryFrontBox(0.12, 3.5, 0.2, -1.5, 2.1, 8.05, darkFrame);
bakeryFrontBox(0.12, 3.5, 0.2, 1.5, 2.1, 8.05, darkFrame);
bakeryFrontBox(18, 0.12, 0.2, 0, 3.85, 8.05, darkFrame);
bakeryFrontBox(18, 0.12, 0.2, 0, 0.45, 8.05, darkFrame);

// Door handles
bakeryFrontBox(0.06, 0.8, 0.12, -0.18, 2, 8.15, darkFrame);
bakeryFrontBox(0.06, 0.8, 0.12, 0.18, 2, 8.15, darkFrame);

// Warm illuminated entrance strips
bakeryFrontBox(0.09, 3.1, 0.12, -1.75, 2.1, 8.18, warmLED);
bakeryFrontBox(0.09, 3.1, 0.12, 1.75, 2.1, 8.18, warmLED);

// Small lights above the entrance
bakeryFrontBox(0.5, 0.12, 0.3, -1, 3.95, 8.15, warmLED);
bakeryFrontBox(0.5, 0.12, 0.3, 1, 3.95, 8.15, warmLED);
const loader = new GLTFLoader();

loader.load(
'./tinas%20bakery.glb',
(gltf) => {
const bakery = gltf.scene;
scene.add(bakery);

const box = new THREE.Box3().setFromObject(bakery);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());

bakery.position.x -= center.x;
bakery.position.z -= center.z;
bakery.position.y -= box.min.y;

const radius = Math.max(size.x, size.y, size.z, 1);

camera.position.set(radius * 1.5, radius * 1.1, radius * 1.5);
camera.near = Math.max(0.01, radius / 1000);
camera.far = radius * 20;
camera.updateProjectionMatrix();

controls.target.set(0, size.y * 0.45, 0);
controls.update();

bakery.traverse((object) => {
if (object.isMesh) {
object.castShadow = true;
object.receiveShadow = true;
}
});

document.getElementById('info').textContent =
"Tina's Bakery – Loaded! Drag to rotate, scroll to zoom.";
},
undefined,
(error) => {
console.error(error);
document.getElementById('info').textContent =
'Could not load bakery. Check the filename and file location.';
}
);

function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
