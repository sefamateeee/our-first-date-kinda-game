<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tina's Bakery - 3D Test</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #e8dfd2;
font-family: Arial, sans-serif;
}
#info {
position: absolute;
top: 15px;
left: 15px;
padding: 12px 16px;
background: rgba(255,255,255,0.9);
border-radius: 10px;
color: #44382e;
z-index: 2;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
}
}
</script>
</head>

<body>
<div id="info">Tina's Bakery – Loading 3D model...</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8dfd2);

const camera = new THREE.PerspectiveCamera(
50, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(8, 15, 10);
sun.castShadow = true;
scene.add(sun);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(200, 200),
new THREE.MeshStandardMaterial({ color: 0xd5c9b9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const loader = new GLTFLoader();

loader.load(
'./tinas%20bakery.glb',
(gltf) => {
const bakery = gltf.scene;
scene.add(bakery);

const box = new THREE.Box3().setFromObject(bakery);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());

bakery.position.x -= center.x;
bakery.position.z -= center.z;
bakery.position.y -= box.min.y;

const radius = Math.max(size.x, size.y, size.z, 1);

camera.position.set(radius * 1.5, radius * 1.1, radius * 1.5);
camera.near = Math.max(0.01, radius / 1000);
camera.far = radius * 20;
camera.updateProjectionMatrix();

controls.target.set(0, size.y * 0.45, 0);
controls.update();

bakery.traverse((object) => {
if (object.isMesh) {
object.castShadow = true;
object.receiveShadow = true;
}
});

document.getElementById('info').textContent =
"Tina's Bakery – Loaded! Drag to rotate, scroll to zoom.";
},
undefined,
(error) => {
console.error(error);
document.getElementById('info').textContent =
'Could not load bakery. Check the filename and file location.';
}
);

function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
