<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tina's Bakery - 3D Test</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #e8dfd2;
font-family: Arial, sans-serif;
}
#info {
position: absolute;
top: 15px;
left: 15px;
padding: 12px 16px;
background: rgba(255,255,255,0.9);
border-radius: 10px;
color: #44382e;
z-index: 2;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
}
}
</script>
</head>

<body>
<div id="info">Tina's Bakery – Loading 3D model...</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8dfd2);

const camera = new THREE.PerspectiveCamera(
50, window.innerWidth / window.innerHeight, 0.1, 1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x887766, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(8, 15, 10);
sun.castShadow = true;
scene.add(sun);

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(200, 200),
new THREE.MeshStandardMaterial({ color: 0xd5c9b9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);
// ===== TINA'S BAKERY BUILDING =====

const bakeryBuilding = new THREE.Group();
scene.add(bakeryBuilding);

// Building dimensions
const bakeryWidth = 20;
const bakeryDepth = 16;

// Materials
const whiteWall = new THREE.MeshStandardMaterial({
color: 0xf4f3ef,
roughness: 0.85
});

const floorMaterial = new THREE.MeshStandardMaterial({
color: 0xc5a783,
roughness: 0.8
});

// Bakery floor
const bakeryFloor = new THREE.Mesh(
new THREE.BoxGeometry(bakeryWidth, 0.25, bakeryDepth),
floorMaterial
);

bakeryFloor.position.y = 0;
bakeryBuilding.add(bakeryFloor);

// Foundation
const foundation = new THREE.Mesh(
new THREE.BoxGeometry(bakeryWidth + 0.4, 0.35, bakeryDepth + 0.4),
new THREE.MeshStandardMaterial({ color: 0x777777 })
);

foundation.position.y = -0.3;
bakeryBuilding.add(foundation);

// Main exterior walls
function bakeryWall(width, height, depth, x, y, z) {
const wall = new THREE.Mesh(
new THREE.BoxGeometry(width, height, depth),
whiteWall
);

wall.position.set(x, y, z);
wall.castShadow = true;
wall.receiveShadow = true;
bakeryBuilding.add(wall);
return wall;
}

const wallHeight = 4.2;
const wallThickness = 0.25;

// Back wall
bakeryWall(
bakeryWidth, wallHeight, wallThickness,
0, wallHeight / 2, -bakeryDepth / 2
);

// Left wall
bakeryWall(
wallThickness, wallHeight, bakeryDepth,
-bakeryWidth / 2, wallHeight / 2, 0
);

// Right wall
bakeryWall(
wallThickness, wallHeight, bakeryDepth,
bakeryWidth / 2, wallHeight / 2, 0
);

// Flat roof
const bakeryRoof = new THREE.Mesh(
new THREE.BoxGeometry(bakeryWidth + 0.5, 0.3, bakeryDepth + 0.5),
new THREE.MeshStandardMaterial({ color: 0xeeeeeb })
);

bakeryRoof.position.y = wallHeight + 0.15;
bakeryBuilding.add(bakeryRoof);
// ===== PALANITINA IOSEFAS BAKERY - FRONT FACADE =====

// Main materials
const facadeWhite = new THREE.MeshStandardMaterial({
color: 0xf4f3ef,
roughness: 0.72
});

const burgundy = new THREE.MeshStandardMaterial({
color: 0x351b1b,
roughness: 0.8
});

const oak = new THREE.MeshStandardMaterial({
color: 0xb58a61,
roughness: 0.65
});

const darkMetal = new THREE.MeshStandardMaterial({
color: 0x202020,
metalness: 0.65,
roughness: 0.3
});

const glass = new THREE.MeshPhysicalMaterial({
color: 0xeaf4f5,
transparent: true,
opacity: 0.22,
roughness: 0.12,
metalness: 0.05,
side: THREE.DoubleSide
});

const ledMaterial = new THREE.MeshStandardMaterial({
color: 0xfff0cf,
emissive: 0xffbd70,
emissiveIntensity: 4
});

// Helper for front facade pieces
function facadeBox(w, h, d, x, y, z, mat) {
const mesh = new THREE.Mesh(
new THREE.BoxGeometry(w, h, d),
mat
);

mesh.position.set(x, y, z);
mesh.castShadow = true;
mesh.receiveShadow = true;
bakeryBuilding.add(mesh);
return mesh;
}

// ===== OUTER WHITE AND BURGUNDY FACADE =====

// Burgundy outer side sections
facadeBox(0.9, 4.2, 0.35, -9.55, 2.1, 8.12, burgundy);
facadeBox(0.9, 4.2, 0.35, 9.55, 2.1, 8.12, burgundy);

// White upper sign wall
facadeBox(18.2, 1.05, 0.45, 0, 3.72, 8.12, facadeWhite);

// White outer pillars
facadeBox(1.1, 3.2, 0.45, -8.5, 1.85, 8.12, facadeWhite);
facadeBox(1.1, 3.2, 0.45, 8.5, 1.85, 8.12, facadeWhite);

// ===== RECESSED TIMBER ENTRANCE =====

// Timber surround
facadeBox(15.8, 0.38, 0.65, 0, 3.25, 7.9, oak);
facadeBox(0.38, 3.1, 0.65, -7.7, 1.7, 7.9, oak);
facadeBox(0.38, 3.1, 0.65, 7.7, 1.7, 7.9, oak);

// Inner dark frame
facadeBox(13.7, 0.16, 0.2, 0, 3.0, 7.62, darkMetal);
facadeBox(0.16, 2.8, 0.2, -6.8, 1.6, 7.62, darkMetal);
facadeBox(0.16, 2.8, 0.2, 6.8, 1.6, 7.62, darkMetal);

// ===== LARGE GLASS SHOPFRONT =====

// Left and right display windows
facadeBox(4.15, 2.65, 0.08, -4.55, 1.65, 7.68, glass);
facadeBox(4.15, 2.65, 0.08, 4.55, 1.65, 7.68, glass);

// Two central sliding glass doors
facadeBox(2.3, 2.65, 0.08, -1.2, 1.65, 7.68, glass);
facadeBox(2.3, 2.65, 0.08, 1.2, 1.65, 7.68, glass);

// Slim glass dividers
facadeBox(0.07, 2.7, 0.12, -2.35, 1.65, 7.72, darkMetal);
facadeBox(0.07, 2.7, 0.12, 2.35, 1.65, 7.72, darkMetal);

// Door handles
facadeBox(0.055, 0.75, 0.08, -0.12, 1.65, 7.78, darkMetal);
facadeBox(0.055, 0.75, 0.08, 0.12, 1.65, 7.78, darkMetal);

// ===== REAL RECESSED WARM LED LIGHTING =====

// Hidden light strips inside the timber surround
facadeBox(0.055, 2.85, 0.08, -7.35, 1.7, 7.53, ledMaterial);
facadeBox(0.055, 2.85, 0.08, 7.35, 1.7, 7.53, ledMaterial);
facadeBox(14.6, 0.055, 0.08, 0, 3.05, 7.53, ledMaterial);

// Actual light spilling onto the entrance
const entranceLightLeft = new THREE.PointLight(0xffc47c, 3.5, 8, 2);
entranceLightLeft.position.set(-6.9, 2.6, 7.1);
bakeryBuilding.add(entranceLightLeft);

const entranceLightRight = new THREE.PointLight(0xffc47c, 3.5, 8, 2);
entranceLightRight.position.set(6.9, 2.6, 7.1);
bakeryBuilding.add(entranceLightRight);

const entranceTopLight = new THREE.PointLight(0xffc47c, 2.5, 10, 2);
entranceTopLight.position.set(0, 3.0, 7.0);
bakeryBuilding.add(entranceTopLight);

// ===== PALANITINA IOSEFAS BAKERY SIGN =====

// Load elegant lettering fonts
const fontLink = document.createElement('link');
fontLink.rel = 'stylesheet';
fontLink.href =
'https://fonts.googleapis.com/css2?family=Allura&family=Oswald:wght@600;700&display=swap';
document.head.appendChild(fontLink);

// Create a high-resolution sign texture
const signCanvas = document.createElement('canvas');
signCanvas.width = 2400;
signCanvas.height = 360;

const signContext = signCanvas.getContext('2d');

function drawBakerySign() {
signContext.clearRect(0, 0, 2400, 360);
signContext.textBaseline = 'middle';

// Bold black PALANITINA
signContext.font = '700 205px Oswald, sans-serif';
signContext.fillStyle = '#171717';
signContext.shadowColor = 'rgba(0,0,0,0.22)';
signContext.shadowBlur = 5;
signContext.shadowOffsetX = 3;
signContext.shadowOffsetY = 4;

signContext.fillText('PALANITINA', 45, 185);

const firstWidth =
signContext.measureText('PALANITINA').width;

// Silver flowing cursive lettering
signContext.shadowColor = 'rgba(0,0,0,0.18)';
signContext.shadowBlur = 4;
signContext.shadowOffsetX = 2;
signContext.shadowOffsetY = 3;

signContext.font = '185px Allura, cursive';

const silverGradient =
signContext.createLinearGradient(0, 70, 0, 280);

silverGradient.addColorStop(0, '#f5f5f5');
silverGradient.addColorStop(0.45, '#a8a8a8');
silverGradient.addColorStop(1, '#e0e0e0');

signContext.fillStyle = silverGradient;

signContext.fillText(
'iosefas bakery',
firstWidth + 100,
190
);

signTexture.needsUpdate = true;
}

const signTexture = new THREE.CanvasTexture(signCanvas);
signTexture.colorSpace = THREE.SRGBColorSpace;

const signMaterial = new THREE.MeshBasicMaterial({
map: signTexture,
transparent: true,
side: THREE.DoubleSide,
depthWrite: false
});

const bakerySign = new THREE.Mesh(
new THREE.PlaneGeometry(13.4, 1.15),
signMaterial
);

bakerySign.position.set(0, 3.85, 8.37);
bakeryBuilding.add(bakerySign);

// Draw once immediately, then redraw after fonts load
drawBakerySign();

document.fonts.ready.then(() => {
drawBakerySign();
});

const loader = new GLTFLoader();

loader.load(
'./tinas%20bakery.glb',
(gltf) => {
const bakery = gltf.scene;
scene.add(bakery);

const box = new THREE.Box3().setFromObject(bakery);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());

bakery.position.x -= center.x;
bakery.position.z -= center.z;
bakery.position.y -= box.min.y;

const radius = Math.max(size.x, size.y, size.z, 1);

camera.position.set(radius * 1.5, radius * 1.1, radius * 1.5);
camera.near = Math.max(0.01, radius / 1000);
camera.far = radius * 20;
camera.updateProjectionMatrix();

controls.target.set(0, size.y * 0.45, 0);
controls.update();

bakery.traverse((object) => {
if (object.isMesh) {
object.castShadow = true;
object.receiveShadow = true;
}
});

document.getElementById('info').textContent =
"Tina's Bakery – Loaded! Drag to rotate, scroll to zoom.";
},
undefined,
(error) => {
console.error(error);
document.getElementById('info').textContent =
'Could not load bakery. Check the filename and file location.';
}
);

function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
