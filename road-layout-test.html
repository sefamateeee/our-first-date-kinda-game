<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Streets Town Road Editor</title>

<style>
body {
margin: 0;
overflow: hidden;
font-family: Arial, sans-serif;
background: #20252a;
}

#panel {
position: absolute;
top: 12px;
left: 12px;
z-index: 5;
background: rgba(0,0,0,.9);
color: white;
padding: 14px;
border-radius: 10px;
width: 230px;
max-height: calc(100vh - 50px);
overflow-y: auto;
}

button, select {
width: 100%;
padding: 10px;
margin-top: 7px;
border: 0;
border-radius: 5px;
cursor: pointer;
}

button {
background: #8ecae6;
color: #14212a;
font-weight: bold;
}

button:active {
background: #64b5d5;
}

#status {
font-size: 12px;
margin-top: 10px;
color: #b8e7ff;
line-height: 1.4;
}

#saved {
width: 100%;
height: 110px;
margin-top: 8px;
font-size: 10px;
box-sizing: border-box;
}

label {
display: block;
margin-top: 12px;
font-size: 13px;
}

.small {
font-size: 11px;
color: #ccc;
line-height: 1.4;
margin-top: 8px;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.170.0/build/three.module.js"
}
}
</script>
</head>

<body>

<div id="panel">

<strong>MIDNIGHT STREETS TOWN EDITOR</strong>

<div id="status">Loading town roads...</div>

<label for="selection">Select a road:</label>
<select id="selection">
<option value="">Loading roads...</option>
</select>

<button id="move">MOVE ROAD</button>
<button id="rotate">ROTATE ROAD</button>
<button id="detach">DESELECT ROAD</button>
<button id="resetView">RESET CAMERA VIEW</button>
<button id="save">SAVE LAYOUT</button>

<label>Saved road positions:</label>
<textarea id="saved" placeholder="Press SAVE LAYOUT. Copy everything here and send it to me."></textarea>

<div class="small">
Move: drag the red or blue arrows.<br>
Rotate: drag the green ring.<br>
Zoom: scroll towards your mouse cursor.<br>
Camera: hold the right mouse button and drag.
</div>

</div>

<script type="module">

import * as THREE from "three";

import { GLTFLoader } from
"https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

import { OrbitControls } from
"https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js";

import { TransformControls } from
"https://unpkg.com/three@0.170.0/examples/jsm/controls/TransformControls.js";


// --------------------------------------
// SCENE
// --------------------------------------

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87969c);

const camera = new THREE.PerspectiveCamera(
55,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(48, 48, 58);

const renderer = new THREE.WebGLRenderer({
antialias: true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(
Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);


// --------------------------------------
// CAMERA CONTROLS
// --------------------------------------

const orbit = new OrbitControls(
camera,
renderer.domElement
);

orbit.target.set(0, 0, 0);
orbit.enableDamping = true;
orbit.dampingFactor = 0.08;

// We use our own cursor-focused zoom.
orbit.enableZoom = false;

orbit.mouseButtons = {
LEFT: THREE.MOUSE.ROTATE,
MIDDLE: THREE.MOUSE.DOLLY,
RIGHT: THREE.MOUSE.PAN
};


// --------------------------------------
// CURSOR-FOCUSED ZOOM
// --------------------------------------

const zoomRaycaster = new THREE.Raycaster();
const zoomMouse = new THREE.Vector2();

const zoomPlane = new THREE.Plane(
new THREE.Vector3(0, 1, 0),
0
);

renderer.domElement.addEventListener(
"wheel",
event => {

event.preventDefault();

zoomMouse.x =
(event.clientX / window.innerWidth) * 2 - 1;

zoomMouse.y =
-(event.clientY / window.innerHeight) * 2 + 1;

zoomRaycaster.setFromCamera(zoomMouse, camera);

const before = new THREE.Vector3();

if (!zoomRaycaster.ray.intersectPlane(
zoomPlane,
before
)) return;

// Smaller number = gentler zoom.
const zoomFactor = Math.exp(
THREE.MathUtils.clamp(
event.deltaY * 0.00035,
-0.12,
0.12
)
);

const distance = camera.position.distanceTo(
orbit.target
);

const newDistance = THREE.MathUtils.clamp(
distance * zoomFactor,
5,
180
);

camera.position.sub(orbit.target)
.normalize()
.multiplyScalar(newDistance)
.add(orbit.target);

orbit.update();

zoomRaycaster.setFromCamera(zoomMouse, camera);

const after = new THREE.Vector3();

if (!zoomRaycaster.ray.intersectPlane(
zoomPlane,
after
)) return;

const shift = before.sub(after);

camera.position.add(shift);
orbit.target.add(shift);

orbit.update();

},
{ passive: false }
);


// --------------------------------------
// LIGHTING
// --------------------------------------

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x59636a,
2
)
);

const sun = new THREE.DirectionalLight(
0xffffff,
2
);

sun.position.set(30, 50, 20);
scene.add(sun);


// --------------------------------------
// GROUND AND GRID
// --------------------------------------

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(220, 220),
new THREE.MeshStandardMaterial({
color: 0x64745c
})
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.15;
scene.add(ground);

const grid = new THREE.GridHelper(
160,
80,
0x53604e,
0x71806b
);

grid.position.y = -0.1;
scene.add(grid);


// --------------------------------------
// ROAD ASSETS
// --------------------------------------

const loader = new GLTFLoader();

const folder = "city-assets/roads/";

const files = {
straight: "MS_RD_01_StraightRoad.glb",
corner: "MS_RD_02_RoadCorner90.glb",
junction: "MS_RD_03_TJunction.glb",
crossroads: "MS_RD_04_Crossroads.glb",
transition64: "MS_RD_06_Transition_6to4.glb"
};

const roads = [];

let selected = null;
let roadNumber = 0;


// --------------------------------------
// ADD A ROAD MODEL
// --------------------------------------

function addRoad(type, x, z, rotation = 0) {

return new Promise((resolve, reject) => {

loader.load(
folder + files[type],

gltf => {

const model = gltf.scene;

// Centre model around its origin.
const bounds = new THREE.Box3()
.setFromObject(model);

const center = bounds.getCenter(
new THREE.Vector3()
);

model.position.x -= center.x;
model.position.z -= center.z;

const adjusted = new THREE.Box3()
.setFromObject(model);

model.position.y -= adjusted.min.y;

model.position.x += x;
model.position.z += z;

model.rotation.y = rotation;

roadNumber++;

model.userData.roadId = roadNumber;
model.userData.roadType = type;

model.traverse(child => {

if (child.isMesh) {
child.castShadow = true;
child.receiveShadow = true;
}

});

scene.add(model);
roads.push(model);

const option = document.createElement("option");

option.value = roads.length - 1;

option.textContent =
roadNumber + " - " + type;

document.getElementById("selection")
.appendChild(option);

document.getElementById("status")
.textContent =
roads.length + " road pieces loaded.";

resolve(model);

},


undefined,

reject
);

});

}


// --------------------------------------
// SELECT A ROAD
// --------------------------------------

function selectRoad(model) {

selected = model;

transform.attach(model);

document.getElementById("selection").value =
roads.indexOf(model);

document.getElementById("status").textContent =
"Selected road " +
model.userData.roadId +
" (" + model.userData.roadType + ")";

}


// --------------------------------------
// TRANSFORM CONTROLS
// --------------------------------------

const transform = new TransformControls(
camera,
renderer.domElement
);

scene.add(transform.getHelper());

transform.addEventListener(
"dragging-changed",
event => {
orbit.enabled = !event.value;
}
);


// --------------------------------------
// EDITOR BUTTONS
// --------------------------------------

document.getElementById("selection")
.addEventListener("change", event => {

const model = roads[
Number(event.target.value)
];

if (model) selectRoad(model);

});


document.getElementById("move").onclick = () => {
transform.setMode("translate");
};


document.getElementById("rotate").onclick = () => {
transform.setMode("rotate");
};


document.getElementById("detach").onclick = () => {

transform.detach();
selected = null;

document.getElementById("selection").value = "";

document.getElementById("status").textContent =
"No road selected.";

};


document.getElementById("resetView").onclick = () => {

camera.position.set(48, 48, 58);

orbit.target.set(0, 0, 0);

orbit.update();

};


document.getElementById("save").onclick = () => {

const layout = roads.map(model => ({

id: model.userData.roadId,

type: model.userData.roadType,

position: {
x: Number(model.position.x.toFixed(3)),
y: Number(model.position.y.toFixed(3)),
z: Number(model.position.z.toFixed(3))
},

rotationY: Number(
model.rotation.y.toFixed(3)
)

}));

document.getElementById("saved").value =
JSON.stringify(layout, null, 2);

document.getElementById("status").textContent =
"Layout ready! Copy the saved positions below.";

};


// --------------------------------------
// CLICK A ROAD TO SELECT IT
// --------------------------------------

const raycaster = new THREE.Raycaster();

const pointer = new THREE.Vector2();

renderer.domElement.addEventListener(
"pointerdown",
event => {

if (event.button !== 0) return;
if (transform.dragging) return;

pointer.x =
(event.clientX / window.innerWidth) * 2 - 1;

pointer.y =
-(event.clientY / window.innerHeight) * 2 + 1;

raycaster.setFromCamera(pointer, camera);

const hits = raycaster.intersectObjects(
roads,
true
);

if (hits.length) {

let object = hits[0].object;

while (
object.parent &&
object.parent !== scene
) {
object = object.parent;
}

if (roads.includes(object)) {
selectRoad(object);
}

}

}
);


// --------------------------------------
// BUILD THE TOWN ROAD LAYOUT
// --------------------------------------

async function buildLayout() {
  async function inspectRoadDimensions() {
const assets = [
"MS_RD_05_NarrowRoad.glb",
"MS_RD_06_Transition_4to3.glb",
"MS_RD_06_Transition_6to4.glb"
];

const results = [];

for (const filename of assets) {
try {
const gltf = await loader.loadAsync(
"city-assets/roads/" + filename
);

gltf.scene.updateMatrixWorld(true);

const bounds = new THREE.Box3()
.setFromObject(gltf.scene);

const size = bounds.getSize(
new THREE.Vector3()
);

results.push(
filename +
"\nX: " + size.x.toFixed(2) +
" | Y: " + size.y.toFixed(2) +
" | Z: " + size.z.toFixed(2)
);

} catch (error) {
results.push(filename + " — FAILED TO LOAD");
}
}

document.getElementById("saved").value =
results.join("\n\n");

document.getElementById("status").textContent =
"Road measurements complete!";
}

inspectRoadDimensions();

try {

// =================================
// MAIN ROAD THROUGH THE MIDDLE
// =================================

await addRoad("crossroads", -24, 0);
await addRoad("crossroads", 24, 0);
  await addRoad("transition64", 34, 7);

// Connect both crossroads with a straight road.
for (const x of [-15, -9, -3, 3, 9, 15]) {
await addRoad("straight", x, 0);
}


// =================================
// UPPER LEFT SIDE OF THE SQUARE
// =================================

await addRoad("straight", -24, 11, Math.PI / 2);
await addRoad("straight", -24, 17, Math.PI / 2);

// Upper left corner.
await addRoad("corner", -24, 24, 0);


// =================================
// TOP OF THE SQUARE
// =================================

for (const x of [-15, -9, -3, 3, 9, 15]) {
await addRoad("straight", x, 24);
}


// =================================
// UPPER RIGHT SIDE
// =================================

await addRoad("corner", 24, 24, Math.PI / 2);

await addRoad("straight", 24, 17, Math.PI / 2);
await addRoad("straight", 24, 11, Math.PI / 2);


// =================================
// LOWER RIGHT SIDE
// =================================

await addRoad("straight", 24, -11, Math.PI / 2);
await addRoad("straight", 24, -17, Math.PI / 2);

await addRoad("corner", 24, -24, Math.PI);


// =================================
// BOTTOM OF THE SQUARE
// =================================

for (const x of [15, 9, 3, -3, -9, -15]) {
await addRoad("straight", x, -24);
}


// =================================
// LOWER LEFT SIDE
// =================================

await addRoad("corner", -24, -24, Math.PI * 1.5);

await addRoad("straight", -24, -17, Math.PI / 2);
await addRoad("straight", -24, -11, Math.PI / 2);


document.getElementById("status").textContent =
roads.length + " road pieces loaded. Check the square layout!";

} catch(error) {

console.error(error);

document.getElementById("status").textContent =
"Loading error: " + error.message;

}
}


buildLayout();


// --------------------------------------
// ANIMATION
// --------------------------------------

function animate() {

requestAnimationFrame(animate);

orbit.update();

renderer.render(scene, camera);

}

animate();


// --------------------------------------
// RESIZE
// --------------------------------------

window.addEventListener("resize", () => {

camera.aspect =
window.innerWidth / window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
