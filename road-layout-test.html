<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Streets - Town Layout</title>

<style>
body {
margin: 0;
overflow: hidden;
background: #20252a;
font-family: Arial, sans-serif;
}
#info {
position: absolute;
top: 12px;
left: 12px;
z-index: 2;
color: white;
background: rgba(0,0,0,.8);
padding: 14px;
border-radius: 8px;
max-width: 260px;
line-height: 1.5;
}
#info strong {
color: #9fe0ff;
}
</style>

<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.170.0/build/three.module.js"
}
}
</script>
</head>

<body>
<div id="info">
<strong>MIDNIGHT STREETS</strong><br>
Connected road layout test<br>
<span id="status">Loading road models...</span><br><br>
Drag to rotate the camera.<br>
Scroll to zoom.
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from
"https://unpkg.com/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from
"https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87969c);

const camera = new THREE.PerspectiveCamera(
55, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(24, 24, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x59636a, 2));

const sunlight = new THREE.DirectionalLight(0xffffff, 2);
sunlight.position.set(20, 35, 15);
scene.add(sunlight);

const ground = new THREE.Mesh(
new THREE.PlaneGeometry(160, 160),
new THREE.MeshStandardMaterial({ color: 0x64745c })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.12;
scene.add(ground);

const grid = new THREE.GridHelper(100, 50, 0x53604e, 0x71806b);
grid.position.y = -0.1;
scene.add(grid);

const loader = new GLTFLoader();
const folder = "city-assets/roads/";

const files = {
straight: "MS_RD_01_StraightRoad.glb",
corner: "MS_RD_02_RoadCorner90.glb",
junction: "MS_RD_03_TJunction.glb",
crossroads: "MS_RD_04_Crossroads.glb"
};

let loaded = 0;
const total = 8;

function addRoad(key, x, z, rotation = 0) {
return new Promise((resolve, reject) => {
loader.load(folder + files[key], (gltf) => {
const model = gltf.scene;

model.rotation.y = rotation;

// Centre the model using its actual bounding box.
let bounds = new THREE.Box3().setFromObject(model);
const center = bounds.getCenter(new THREE.Vector3());
model.position.x -= center.x;
model.position.z -= center.z;

bounds = new THREE.Box3().setFromObject(model);
model.position.y -= bounds.min.y;

model.position.x += x;
model.position.z += z;

model.traverse((child) => {
if (child.isMesh) {
child.castShadow = true;
child.receiveShadow = true;
}
});

scene.add(model);
loaded++;
document.getElementById("status").textContent =
loaded + " of " + total + " road models loaded";

resolve(model);
}, undefined, reject);
});
}

async function buildLayout() {
try {
// Central crossroads
await addRoad("crossroads", 0, 0);

// Main road approaching from both directions
await addRoad("straight", 8, 0);
await addRoad("straight", -8, 0);

// Roads running north and south
await addRoad("straight", 0, 8, Math.PI / 2);
await addRoad("straight", 0, -8, Math.PI / 2);

// Two T-junctions branching off the main street
await addRoad("junction", 16, 0);
await addRoad("junction", -16, 0, Math.PI);

// Continue the main street beyond both junctions
await addRoad("straight", 24, 0);
await addRoad("straight", -24, 0);

document.getElementById("status").textContent =
"Main street and two T-junctions loaded.";

} catch (error) {
console.error(error);
document.getElementById("status").textContent =
"Loading failed: " + error.message;
}
}

buildLayout();

function animate() {
requestAnimationFrame(animate);
controls.update();
renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
